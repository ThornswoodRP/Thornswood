<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The members' hub, never for a search index; robots.txt keeps crawlers
     off every address that serves this page as well (#4472). -->
<meta name="robots" content="noindex">
<title>Thornswood</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icon-192.png">
<!-- Both from this site since entry 247, the same files the public front uses,
     rather than from Google and Cloudflare's library CDN. The faces are in
     hub.css itself, so this one sheet is all the first paint waits on (#4334). -->
<link rel="stylesheet" href="/hub.css">
</head>
<body>

<div id="gate">
  <div class="box">
    <!-- logo-84.webp, 5.9 KB, not logo.png, 89 KB, for an 82 px emblem (#4143). -->
    <img src="/logo-84.webp" alt="Thornswood" width="82" height="82" class="gate-logo">
    <h1>The Works</h1>
    <p>Discord decides who gets in here, the same as it decides who gets into
      the game. No second password to pass around.</p>
    <a class="discord big" id="gatediscord" href="/auth/discord">Sign in with Discord</a>
    <!--
      There is no password on this door any more. Discord roles decide who gets
      in here exactly as they decide who gets into the game, so a second secret
      that has to be passed around by hand is one more thing to leak.

      The box below exists only until Discord is configured, because otherwise
      the one person who could configure it cannot get in to do it.
    -->
    <div id="pwbox" hidden>
      <p class="said said-gate">Discord sign in is not set up on
        this server yet.</p>
      <label for="pw">Server password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="server password">
      <button class="enter" id="go">Enter</button>
    </div>
    <div class="err" id="err" role="status"></div>
    <p class="backhome"><a href="/">Back to thornswood.net</a></p>
  </div>
</div>

<div id="shell">
  <nav>
    <a class="brand" href="/hub"><img src="/logo-28.webp" srcset="/logo-28.webp 1x, /logo-56.webp 2x, /logo-84.webp 3x" alt="" width="22" height="22">Thornswood</a>
    <a class="backout" href="/">&larr; the public site</a>
    <div id="tabs"></div>
    <div class="sep" id="whoami"></div>
    <!-- What a staff action did, said aloud (#4421). Here in the page's frame,
         so no action redraws it: a line inside the redrawn area is thrown
         away, or drawn again with its words already in it, before a screen
         reader reads it. -->
    <p class="said" id="hubsaid" role="status" aria-live="polite"></p>
  </nav>
  <main><div class="wrap" id="page"></div></main>
</div>

<script src="/copies.js"></script>
<!-- marked is read only by hub.js, so it loads here, just before it, and the
     sign-in page no longer waits on it in the head (#4143). A plain script,
     not deferred, so it has run by the time hub.js does. -->
<script src="/marked-12.0.2.min.js"></script>
<script src="/hub.js"></script>
</body>
</html>
