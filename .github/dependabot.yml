# What this repository depends on, watched rather than remembered.
#
# FOUR ECOSYSTEMS, because four manifests exist here, and the engine
# submodule is watched another way (below).
#
# github-actions: every workflow pins actions by full length commit SHA (see
# build.yml), and a pinned action still goes stale quietly when the tag it
# was taken from moves. Dependabot opens a pull request that updates the SHA
# and the tag comment together.
#
# pip: bot\requirements.txt names the three libraries the bot and its
# harnesses install (discord.py, pillow, certifi). Nightly installs from that
# file into a per-run venv; Install-Bot.ps1 installs the same file on the VPS.
# Watching /bot keeps those versions from going stale without a hand check.
# It compiles for the Python bot\.python-version names (3.12, the bot's),
# as the file's header does; without it Dependabot used its own newer Python
# and pulled in audioop-lts, which has no 3.12 wheel (#5242).
#
# npm: only the Electron prototype of the launcher stack study (#3209,
# docs/studies/launcher-stack/prototypes/electron). It never ships; it is
# built by hand on a Windows machine to measure Electron against the other
# stacks. It is watched anyway, so a security fix for Electron reaches it
# the same way as for anything else, and its updates come as one grouped
# pull request a week. The site and the voice service are deliberately
# written against node's own library and depend on nothing, so they have no
# package.json and no entry: pointing dependabot at a folder with no
# manifest gives an error on the Dependabot tab that reads like a fault and
# watches nothing, which is worse than not configuring it. The npm lockfiles
# that ship are the engine's (skymp5-server, skymp5-client and skymp5-front),
# and they are watched in the fork, where they live: its
# .github/dependabot.yml on main targets thornswood/engine-changes (#2759,
# #3683). A bump there reaches this repository through the usual pin move.
#
# NOT gitsubmodule, for engine/skymp (issue #1348). Dependabot's bump would
# move the pin alone, and a pin is merged only with a client build and a
# server build of the same commit, recorded in records\client-build.json and
# records\server-build.json on a machine that builds the engine (engine\README.md,
# "One engine"). tests\test-one-engine.js turns every such pull request red,
# so each would sit open until closed by hand. The bump itself is already
# watched: tests\test-engine-at-fork-head.js runs every night (nightly.yml)
# and is red, naming the commits, as soon as the head of
# thornswood/engine-changes has a change the pin does not, and a red night
# opens an issue on the board. Upstream skyrim-multiplayer/skymp reaches us
# only through that branch, so a submodule entry here would not see it.
#
# The launcher is C# in launcher/app/Thornswood.csproj, an SDK project whose
# libraries are PackageReference lines from nuget.org (#4823): Avalonia, and
# Concentus, SharpSRTP and BouncyCastle for voice. Moving one means rewriting
# its section of THIRD-PARTY.md, the credits page and its text in
# installer/licences in the same pull request.
#
# nuget (#4161, Patrick's A on the NuGet card, 9 Nov 2026): one grouped
# entry a week for the launcher and the deploy agent. Its directories are
# every project that has to move with them:
#   - launcher/app, the launcher;
#   - launcher/tests/window-starts, which starts the launcher's window on
#     the launcher's own Avalonia version;
#   - scripts/release/ShipRoot, which carries the launcher's Velopack and
#     ProtectedData, at the launcher's versions (tests\test-2019-ship-roots.ps1);
#   - tools/DeployAgent, the deploy agent on the box;
#   - tools/DeployAgent.Tests, whose lock file pins the agent's package and
#     is restored in locked mode (deploy-agent.yml); its own test libraries
#     are ignored, since they are not the launcher's or the agent's.
# tests\voice-launcher reads its versions out of the launcher's project, so
# it moves with no line of its own. A bump is held on the pull request gate
# by scripts\dev\Check-PackageNotices.ps1 (tests\test-4161-package-notices.ps1)
# until THIRD-PARTY.md, the credits page and installer/licences name the new
# versions; that update is a Bot's commit on the bump's own pull request.
#
# Weekly rather than daily: this is a small team, and a pull request a day
# from a robot is a pull request nobody reads.
#
# ONE PULL REQUEST PER ECOSYSTEM A WEEK (#5250). Each pull request runs the
# whole Build check (six Windows jobs) and CodeQL, and on 1 Nov the week's
# updates came as six pull requests at once, four of them one action each:
# about fifty jobs in one burst, which queued for up to sixteen minutes
# behind everybody's own pull requests. So the actions come as one grouped
# pull request, the bot's libraries as another, the same as the Electron
# prototype's always did. A bump that breaks the build is still found: the
# grouped pull request goes red and names the step.
#
# LABELS: each update names the area: label its part already has, so its pull
# requests sort like everything else. Without a labels list Dependabot puts on
# its own dependencies and github_actions, and makes them again when they are
# deleted (#3733, Patrick's A of 26 Oct 2026: both were deleted).
#
# NO REBASING (#5327): every entry sets rebase-strategy: disabled. Left out,
# it is auto, and Dependabot pushes a new head to each of its open pull
# requests every time main moves. A yes is given for one exact head, and a
# change under .github/workflows/ needs Patrick's yes at its head, so an
# auto rebase made that yes stale within minutes of it being given (#5327:
# answered for 26818b4, rebased to 396dc8a 102 seconds later). Staying
# current buys nothing here: main's merge queue builds every pull request on
# the newest main before it lands, and that build has to pass. A pull request
# with a real conflict is still rebased, by a comment asking Dependabot to,
# and that new head needs a new yes like any other push.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "area: GitHub & CI"
    rebase-strategy: disabled

  - package-ecosystem: pip
    directory: /bot
    schedule:
      interval: weekly
    commit-message:
      prefix: "bot"
    groups:
      bot-libraries:
        patterns: ["*"]
    labels:
      - "area: Discord"
    rebase-strategy: disabled

  - package-ecosystem: npm
    directory: /docs/studies/launcher-stack/prototypes/electron
    schedule:
      interval: weekly
    groups:
      launcher-stack-electron:
        patterns: ["*"]
    commit-message:
      prefix: "study"
    labels:
      - "area: Launcher"
    rebase-strategy: disabled

  - package-ecosystem: nuget
    directories:
      - /launcher/app
      - /launcher/tests/window-starts
      - /scripts/release/ShipRoot
      - /tools/DeployAgent
      - /tools/DeployAgent.Tests
    schedule:
      interval: weekly
    groups:
      launcher-and-tools:
        patterns: ["*"]
    ignore:
      # DeployAgent.Tests is here for its lock file only, which pins the
      # agent's own package; its test libraries are not the launcher's.
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "xunit"
      - dependency-name: "xunit.runner.visualstudio"
    commit-message:
      prefix: "launcher"
    labels:
      - "area: Launcher"
    rebase-strategy: disabled
