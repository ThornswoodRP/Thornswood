# One signed Release for every merge that changes what Thornswood ships, built
# once on GitHub from the merged commit, and a Deployment to Dev for it (#5179,
# plan parts 7, 9 and 13). The box deploy agent (#5180) sees the Deployment
# within a minute, holds the Release to its signature and manifest, and puts
# what it applies on the dev server; docs/DEPLOY-AGENT.md says how.
#
# WHAT A RELEASE CARRIES. Every Release carries every part, so any of them can
# be put back by its tag:
#   gamemode  game/gamemode.js and its stamp, thornswood-build.json, and
#             gamemode-tables.zip, the tables the gamemode reads (#5191),
#             zipped by App-Part.ps1 so the same tables give the same bytes
#   bot       the bot pass a dev Deployment waits on (#5196)
#   server    the server build the commit records (records/server-build.json),
#             CI's build of the pin as ServerArtifact.ps1 zips it (#5219)
#   launcher  the launcher's folder as Build-Launcher.ps1 publishes it
#             (#4823, #4825): Thornswood.exe, compiled to native code, and the
#             native libraries beside it, every one signed, with the sources'
#             number (LauncherVersion.ps1) in the manifest. Built whenever a
#             Velopack package is made, with the package's version as its
#             own (-p:Version), so the number the launcher says is the one
#             Velopack installed; otherwise the signed files of the Release
#             before are carried, each held to that manifest's sha256 and the
#             launcher's own signature check, as a Ship keeps the feed's
#             launcher (#921)
#   game      the game files: dev's last release from the site with this
#             commit's own files built over it, as one zip and its list
#             (Build-GameFiles.ps1), the folder a Ship -FromFeed builds
#   site      the site's zip (App-Part.ps1): server.js, its public pages
#   discord   the Discord bot's zip: its code, not its token or records
#   voice     the voice service's zip, which rides dev's Deployment
#   velopack  when the launcher's sources or the game files changed: dev's
#             Velopack package of both (Patrick's B on #3209: one channel
#             for the launcher and the game payload), with its feed files, a
#             delta from the Velopack release before, setup-files.dev.json
#             (the files beside Game the install reads on the first start,
#             Build-SetupFiles.ps1) and Thornswood-Dev-Setup.exe, Velopack's
#             installer, which puts the launcher on a PC and starts it; the
#             launcher's first start is the install (#4824), and
#             Thornswood-Dev-Move.exe, which a launcher from before Velopack
#             takes as its last update and which moves that install to the
#             new launcher (launcher/move). A dev launcher
#             reads its updates from here (launcher/app/Velo*.cs), each
#             package held to this manifest and its signed catalog, and takes
#             its game files out of the package (SyncPackage.cs). The
#             portable copy vpk also makes does not go out
#   main      with every velopack part: main's package of the same launcher
#             and game files, whole, with main's feed files,
#             setup-files.main.json, Thornswood-Setup.exe and
#             Thornswood-Move.exe. Listed in the
#             manifest and held, not published (MAIN'S PACKAGE below)
#   after     the steps after a deploy: every step file of deploy/after and
#             the gate's verbs.json, which says which verbs a step may run
#             (#5186). The agent runs each step once on each environment,
#             after a Deployment of this Release succeeds; deploy/after's
#             README says how a step file is written
# The agent applies gamemode, bot, server, site, discord, voice and after
# and names the other parts in its log.
#
# WHAT CHANGED. Each part is compared with the same part of the newest build
# Release before (MergeRelease.ps1 says what is compared). A merge that
# changed no part publishes nothing and asks for nothing. Otherwise the
# Release goes out, and each place a changed part runs gets a Deployment:
# Dev for any part but the site and the bot, Site when the site changed and
# Discord bot when the bot did (#5190, #5187). A merge that changed only the
# site puts nothing on dev.
#
# THE NOTES. The Release's body is the note people read: the Release note
# lines of the pull requests merged since the Release before, joined and held
# to Note-Rules (Collect-ReleaseNotes.ps1). When every one of them says none,
# the body is the single line in NOTHING_TO_TELL below, which the news steps
# read as nothing to announce. A merged pull request with no Release note line
# stops the run before anything is built: a published Release never changes,
# so its body cannot be put right later. Write the line into that pull
# request's body and run this again by hand (workflow_dispatch on main).
#
# HOW IT IS SIGNED. In the "release" environment, main only (#3930): the
# launcher's programs (when built) and Velopack's own with ThornswoodRelease
# (Sign-OnRunner.ps1; Velopack calls it for each program, never for a game
# file), then a manifest of every file with its sha256 and a catalog over the
# manifest, signed, and held to the manifest before anything is published.
# Every file of the Release also gets a GitHub build provenance attestation
# (the plan's security line: attestations on every release file), which
# `gh attestation verify <file> -R ThornswoodRP/Thornswood` checks. Releases
# here are immutable once published, so the files go on a draft that is
# published only when whole.
#
# MAIN'S PACKAGE. Velopack writes the channel into the package, so main's is
# a package of its own, made by every merge that makes dev's and listed in
# the same signed record. Its files are never on the build Release: they are
# kept with this run as the artifact main-<tag> (New-SignedManifest.ps1 puts
# them in held\, and they get their own attestation), and only a promotion
# to main publishes them, on a Release main-<tag> of their own, once Patrick
# approves it (promote-main.yml, MAIN'S LAUNCHER; #5181). A main launcher
# holds the package to this Release's record all the same (VeloRecord.cs).
# An artifact is kept 90 days at most, so a build older than that, never
# promoted, can no longer take its package to main.
#
# THE DEPLOYMENT. To Dev, the environment that until this workflow held
# Record-Deployment.ps1's after-the-fact records of each Ship (#5179 retires
# that script here): one Deployment now says both what dev should run and,
# by the agent's status on it, whether it does. Main follows as the same
# Release deployed to Main after Patrick's Approve click (#5181).
#
# Any of these Releases can be put on dev by its tag, which is how dev is put
# back: pwsh scripts/vps/Box-Run.ps1 -Line 'Deploy-Release -Tag <tag>'.
#
# The site and the Discord bot get Deployments of their own, to Site and to
# Discord bot, with the part beside the tag; the agent swaps in that part's
# zip (docs/DEPLOY-AGENT.md, "The site, the Discord bot and voice") and leaves
# the Release's notes for the bot's news once it is up. Neither environment
# waits on an approval: they are what Deploy-Docs and Install-Bot -CodeOnly
# put out by hand on any merge until now.
name: Merge release

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'launcher/**'
      # Not its harnesses (plan line 42): a change to a check is no new
      # launcher, as LauncherVersion.ps1 says.
      - '!launcher/tests/**'
      - 'records/**'
      - 'deploy/after/*.json'
      - 'scripts/bot/Bot-Pass.js'
      - 'scripts/bot/bot.js'
      - 'scripts/bot/character.js'
      - 'scripts/bot/relay.js'
      # What App-Part.ps1 puts in the site, the Discord bot and voice.
      - 'site/server.js'
      - 'site/lib/**'
      - 'site/public/**'
      - 'site/data/site/**'
      - 'bot/bot.py'
      # The bot's modules, which bot.py imports (#5357).
      - 'bot/bot_*.py'
      - 'bot/_pyguard.py'
      - 'bot/trust.py'
      - 'bot/card.py'
      - 'bot/staff-channel.txt'
      - 'bot/dev-channel.txt'
      - 'bot/requirements.txt'
      - 'bot/factions.json'
      - 'bot/assets/join-card.png'
      - 'voice/voice-server.js'
      - 'voice/headlines.js'
      - 'scripts/vps/Server-Log.js'
      - 'scripts/release/App-Part.ps1'
      - 'scripts/release/Build-GameFiles.ps1'
      - 'scripts/release/Build-Front.ps1'
      - 'scripts/release/Build-Launcher.ps1'
      - 'scripts/release/Build-SetupFiles.ps1'
      - 'scripts/release/Source-Notice.ps1'
      - 'scripts/release/Go.ps1'
      - 'scripts/release/MergeRelease.ps1'
      - 'scripts/release/New-SignedManifest.ps1'
      - '.github/workflows/merge-release.yml'
  workflow_dispatch:

permissions:
  contents: read

# The newest merge is the one released (#5398). GitHub refuses the run's own
# token any tag on a commit whose workflow files differ from main's (it asks
# for workflows: write, which that token can never hold), so a merge main
# has moved past with a workflow change can never be tagged. A newer merge
# cancels the run of the one before it, and its Release carries every part
# and the notes of every pull request since the Release before, so nothing
# a superseded merge changed is left out. A merge this workflow does not run
# for cancels nothing, so a run that main moved past that way starts a run of
# main's newest merge itself (Is this still main's newest merge).
concurrency:
  group: merge-release
  cancel-in-progress: true

env:
  NOTHING_TO_TELL: 'Nothing people would notice: every change in this release says none.'
  # Velopack's command line, at a version published on 29 Sep 2026.
  VPK_VERSION: '1.2.161'

jobs:
  release:
    name: Build, sign and release the merge
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    environment: release
    # The engine package (about 100 MB), dev's last release from the site and
    # the Velopack package are the slow parts.
    timeout-minutes: 60
    permissions:
      contents: write
      deployments: write
      id-token: write
      attestations: write
      # To start a run of main's newest merge when main moved on during
      # this one (Is this still main's newest merge).
      actions: write
    steps:
      # The whole history: the launcher's number is the time its sources last
      # changed on main (LauncherVersion.ps1), which a shallow clone cannot say.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Name the release and read the one before
        id: names
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/release/MergeRelease.ps1
          $now = (Get-Date).ToUniversalTime()
          # Every name the day already uses, tags and Releases (drafts too).
          $refs = gh api "repos/$($env:GITHUB_REPOSITORY)/git/matching-refs/tags/build-$($now.ToString('yyyyMMdd'))." --jq '.[].ref'
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::GitHub did not list the build tags'; exit 1 }
          $rels = gh api "repos/$($env:GITHUB_REPOSITORY)/releases?per_page=100" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::GitHub did not list the Releases'; exit 1 }
          $taken = @($refs | ForEach-Object { $_ -replace '^refs/tags/', '' }) + @($rels)
          $n = New-MergeReleaseNames -Utc $now -Taken $taken
          try {
            $prev = Get-MergeReleasePrevious
            $since = if ($prev) {
              Resolve-MergeReleaseSince -Commit $prev.Commit -Subject {
                param($c)
                $m = gh api "repos/$($env:GITHUB_REPOSITORY)/commits/$c" --jq '.commit.message'
                if ($LASTEXITCODE -ne 0) { throw "GitHub did not hand over commit $c" }
                @($m)[0]
              }
            } else { '' }
          }
          catch { Write-Host ('::error::' + $_.Exception.Message); exit 1 }
          $prevFile = Join-Path $env:RUNNER_TEMP 'previous-manifest.json'
          if ($prev) {
            [IO.File]::WriteAllText($prevFile, ($prev.Manifest | ConvertTo-Json -Depth 8 -Compress))
            Write-Host "the Release before is $($prev.Tag), commit $($prev.Commit)"
          } else { Write-Host 'there is no build Release before this one' }
          Write-Host "this release is $($n.Tag), Velopack version $($n.Velopack)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("tag=" + $n.Tag)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("velopack=" + $n.Velopack)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("previous=" + $(if ($prev) { $prev.Tag } else { '' }))
          if ($prev -and $since -ne $prev.Commit) { Write-Host "its commit is not in this history (rewritten, #5231); the same merge here is $since" }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("since=" + $since)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("previous_manifest=" + $(if ($prev) { $prevFile } else { '' }))

      # Before anything is built: a missing Release note line stops the run
      # here (header, THE NOTES).
      - name: Write the notes from the merged pull requests
        id: notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.names.outputs.since }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'notes.md'
          $a = @{ Until = $env:GITHUB_SHA; Repo = $env:GITHUB_REPOSITORY; OutFile = $file }
          if ($env:SINCE) { $a['Since'] = $env:SINCE }
          & ./scripts/release/Collect-ReleaseNotes.ps1 @a
          $rc = $LASTEXITCODE
          if ($rc -eq 3) { [IO.File]::WriteAllText($file, $env:NOTHING_TO_TELL + "`n"); $rc = 0 }
          if ($rc -ne 0) { Write-Host "::error::the notes could not be written (Collect-ReleaseNotes.ps1 exit $rc); the lines above say why, and nothing was built"; exit 1 }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("file=" + $file)
          # Exit 3 is an answer, not a failure, but GitHub's pwsh step ends
          # with "exit $LASTEXITCODE", which still holds the script's 3: the
          # step says how it went itself (run 41362111729 stopped here).
          exit 0

      - name: Fetch CI's server build of the pin
        id: server
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The fork's own build of the commit records/server-build.json names,
          # every file held to the records (Get-EngineArtifact.ps1), and the
          # server zip it makes of it, as the box's Publish-Server takes it.
          ./scripts/release/Get-EngineArtifact.ps1 -NoPause
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::CI's engine build of the pin could not be fetched; the lines above say why"; exit 1 }
          . ./scripts/release/Read-JsonFile.ps1
          $ciDir = & ./scripts/release/Where.ps1 EngineArtifact
          $ciStamp = Join-Path $ciDir 'engine-artifact.json'
          $ciInfo = ConvertFrom-ThornswoodJson ([IO.File]::ReadAllText($ciStamp)) $ciStamp
          $zip = Join-Path (Join-Path (Join-Path $ciDir 'artifact') 'server') ([string]$ciInfo.serverZip)
          if (-not $ciInfo.serverZip -or -not (Test-Path -LiteralPath $zip -PathType Leaf)) { Write-Host "::error::$ciStamp names no server zip that is there"; exit 1 }
          Write-Host "server build $($ciInfo.serverZip)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("zip=" + $zip)

      # Before the launcher: whether the game files changed decides whether
      # a Velopack package is made, and so whether the launcher is built.
      - name: Build the game files over dev's last release
        id: game
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.names.outputs.previous }}
          PREVIOUS_MANIFEST: ${{ steps.names.outputs.previous_manifest }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'game'
          $a = @{ Out = $out; Root = (Join-Path $env:RUNNER_TEMP 'game-root'); Commit = $env:GITHUB_SHA }
          if ($env:PREVIOUS_MANIFEST) {
            # The list of the Release before, held to its manifest, for what
            # this one no longer ships (Build-GameFiles.ps1, WHAT IS GONE).
            $pm = Get-Content -LiteralPath $env:PREVIOUS_MANIFEST -Raw | ConvertFrom-Json
            $pf = @($pm.parts.PSObject.Properties | Where-Object Name -eq 'game' | ForEach-Object { $_.Value } | Where-Object { $_.name -eq 'game-files.json' })
            if ($pf.Count -ne 1) { Write-Host "::error::the game part of $($env:PREVIOUS) lists no game-files.json"; exit 1 }
            $pdir = Join-Path $env:RUNNER_TEMP 'previous-game'
            New-Item -ItemType Directory -Force -Path $pdir | Out-Null
            gh release download $env:PREVIOUS -R $env:GITHUB_REPOSITORY -p 'game-files.json' -D $pdir --clobber
            $plist = Join-Path $pdir 'game-files.json'
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $plist -PathType Leaf)) { Write-Host "::error::game-files.json of $($env:PREVIOUS) could not be downloaded"; exit 1 }
            if ((Get-FileHash -LiteralPath $plist -Algorithm SHA256).Hash.ToLowerInvariant() -ne ([string]$pf[0].sha256).ToLowerInvariant()) { Write-Host "::error::game-files.json of $($env:PREVIOUS) is not the one its manifest names"; exit 1 }
            $a['PreviousList'] = $plist
          }
          ./scripts/release/Build-GameFiles.ps1 @a
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $zip = Join-Path $out 'game.zip'
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { Write-Host "::error::Build-GameFiles.ps1 left no game.zip in $out"; exit 1 }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("zip=" + $zip)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("list=" + (Join-Path $out 'game-files.json'))
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("sha=" + (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant())

      # Built whenever a Velopack package is made (header, WHAT A RELEASE
      # CARRIES; MergeRelease.ps1, ONE NUMBER), with the package's version.
      - name: The launcher, built and signed or carried from the Release before
        id: launcher
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          VERSION: ${{ steps.names.outputs.velopack }}
          GAME_SHA: ${{ steps.game.outputs.sha }}
          PREVIOUS: ${{ steps.names.outputs.previous }}
          PREVIOUS_MANIFEST: ${{ steps.names.outputs.previous_manifest }}
        run: |
          . ./scripts/release/LauncherVersion.ps1
          . ./scripts/release/MergeRelease.ps1
          try { $ver = Get-LauncherVersion -RepoDir . }
          catch { Write-Host ('::error::' + $_.Exception.Message); exit 1 }
          $dir = Join-Path $env:RUNNER_TEMP 'launcher'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pm = if ($env:PREVIOUS_MANIFEST) { Get-Content -LiteralPath $env:PREVIOUS_MANIFEST -Raw | ConvertFrom-Json } else { $null }
          $build = Test-MergeReleaseVelopack -LauncherVersion $ver -GameZipSha256 $env:GAME_SHA -Previous $pm
          if (-not $build) {
            # Every file of the launcher part before, each held to that
            # manifest's sha256, and each program to the launcher's own
            # signature check.
            . ./scripts/release/Assert-PublishSigned.ps1
            $signer = Get-ExpectedSignerFragment -RepoRoot .
            $pl = @($pm.parts.PSObject.Properties | Where-Object Name -eq 'launcher' | ForEach-Object { $_.Value })
            if (@($pl | Where-Object { $_.name -eq 'Thornswood.exe' }).Count -ne 1) { Write-Host "::error::the launcher part of $($env:PREVIOUS) has no Thornswood.exe"; exit 1 }
            foreach ($f in $pl) {
              $file = Join-Path $dir ([string]$f.name)
              gh release download $env:PREVIOUS -R $env:GITHUB_REPOSITORY -p ([string]$f.name) -D $dir --clobber
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $file -PathType Leaf)) { Write-Host "::error::$($f.name) of $($env:PREVIOUS) could not be downloaded"; exit 1 }
              $sha = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($sha -ne ([string]$f.sha256).ToLowerInvariant()) { Write-Host "::error::$($f.name) of $($env:PREVIOUS) is not the one its manifest names"; exit 1 }
              if ([IO.Path]::GetExtension($file) -in '.exe', '.dll') {
                $why = Get-PublishSignRefusal -Path $file -ExpectedSigner $signer
                if ($why) { Write-Host ('::error::' + $f.name + ' of ' + $env:PREVIOUS + ' fails the launcher''s own signature check: ' + $why); exit 1 }
              }
            }
            Write-Host "launcher $ver and the game files are unchanged since $($env:PREVIOUS); its signed launcher is carried"
          } else {
            # RUNNER_TEMP, never a real install, so no shortcut or running game
            # is touched; signing is its own call, -Required.
            $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
            $built = Join-Path $root 'Launcher'
            New-Item -ItemType Directory -Force -Path $built | Out-Null
            ./scripts/release/Build-Launcher.ps1 -Root $root -NoSign -NoPause -Version $env:VERSION
            if ($LASTEXITCODE -ne 0) { Write-Host '::error::Build-Launcher.ps1 failed'; exit 1 }
            # The programs go out; the symbols, Thornswood.pdb, stay here, and
            # so do app.ico and app-dev.ico, which Build-Launcher.ps1 puts
            # beside the exe only for Install-Launcher.ps1 (#887): the
            # launcher writes its own icon from the copy compiled into it
            # (launcher/app/Icons.cs, IconFile), so a package never needs
            # them. Any other file would be refused by the launcher in its
            # own update (launcher/app/VeloPackage.cs), so it stops the run
            # here instead.
            $files = @(Get-ChildItem -LiteralPath $built -File | Where-Object Extension -notin '.pdb', '.ico')
            $other = @($files | Where-Object { $_.Extension -notin '.exe', '.dll' } | ForEach-Object { $_.Name })
            if ($other.Count) { Write-Host ("::error::the launcher's publish left files that are not programs: " + ($other -join ', ')); exit 1 }
            foreach ($f in $files) { Copy-Item -LiteralPath $f.FullName -Destination (Join-Path $dir $f.Name) -Force }
            ./scripts/release/Sign-OnRunner.ps1 -Path @(Get-ChildItem -LiteralPath $dir -File | ForEach-Object { $_.FullName })
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Host "launcher $ver built as $($env:VERSION) and signed: $(($files | ForEach-Object { $_.Name }) -join ', ')"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("dir=" + $dir)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("version=" + $ver)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("built=" + $(if ($build) { 'yes' } else { 'no' }))

      # The same files give the same bytes (App-Part.ps1), so an app whose
      # files no merge touched is not a change.
      - name: Zip the site, the Discord bot and voice
        id: apps
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'apps'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($p in 'site', 'discord', 'voice') {
            $zip = Join-Path $dir "$p.zip"
            ./scripts/release/App-Part.ps1 -Part $p -Out $zip
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::App-Part.ps1 could not make the $p zip; the lines above say why"; exit 1 }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("$p=" + $zip)
          }

      # A first manifest, unsigned, of every part but velopack, only to see
      # what changed since the Release before (MergeRelease.ps1).
      - name: Stamp the gamemode and see what changed
        id: changed
        shell: pwsh
        env:
          TAG: ${{ steps.names.outputs.tag }}
          SERVER_ZIP: ${{ steps.server.outputs.zip }}
          LAUNCHER_DIR: ${{ steps.launcher.outputs.dir }}
          LAUNCHER_VERSION: ${{ steps.launcher.outputs.version }}
          LAUNCHER_BUILT: ${{ steps.launcher.outputs.built }}
          GAME_ZIP: ${{ steps.game.outputs.zip }}
          GAME_LIST: ${{ steps.game.outputs.list }}
          SITE_ZIP: ${{ steps.apps.outputs.site }}
          DISCORD_ZIP: ${{ steps.apps.outputs.discord }}
          VOICE_ZIP: ${{ steps.apps.outputs.voice }}
          PREVIOUS_MANIFEST: ${{ steps.names.outputs.previous_manifest }}
        run: |
          . .\scripts\release\BuildStamp.ps1
          . .\scripts\release\MergeRelease.ps1
          $out = Join-Path $env:RUNNER_TEMP 'gamemode'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $gm = Join-Path $out 'gamemode.js'
          Copy-Item -LiteralPath 'game\gamemode.js' -Destination $gm
          $stamp = Join-Path $out 'thornswood-build.json'
          $s = Save-ThornswoodBuildStamp -Gamemode $gm -Channel dev -RepoDir . -Path $stamp
          Write-Host (Format-ThornswoodBuildStamp $s)
          $tables = Join-Path $out 'gamemode-tables.zip'
          ./scripts/release/App-Part.ps1 -Part tables -Out $tables
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host ('gamemode tables are git tree ' + (git rev-parse "$($env:GITHUB_SHA):game/gamemode-tables"))
          $bot = @(@('Bot-Pass.js', 'bot.js', 'character.js', 'relay.js') | ForEach-Object { Join-Path 'scripts\bot' $_ }) + @(@('voice-server.js', 'headlines.js') | ForEach-Object { Join-Path 'voice' $_ })
          $launcher = @(Get-ChildItem -LiteralPath $env:LAUNCHER_DIR -File | ForEach-Object { 'launcher=' + $_.FullName })
          $adds = $launcher + @("game=$($env:GAME_ZIP)", "game=$($env:GAME_LIST)",
                    "site=$($env:SITE_ZIP)", "discord=$($env:DISCORD_ZIP)", "voice=$($env:VOICE_ZIP)")
          # The steps after a deploy and the verbs they are held to (#5186).
          $steps = @(Get-ChildItem -LiteralPath 'deploy\after' -Filter '*.json' -File | Sort-Object Name | ForEach-Object { 'after=' + $_.FullName })
          $adds += $steps + @('after=' + (Resolve-Path 'scripts\vps\gate\verbs.json').Path)
          Write-Host ("steps after a deploy: " + $(if ($steps.Count) { ($steps | ForEach-Object { Split-Path -Leaf $_ }) -join ', ' } else { 'none' }))
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'parts.txt') -Value $adds
          $probe = Join-Path $env:RUNNER_TEMP 'probe'
          ./scripts/release/New-SignedManifest.ps1 -Out $probe -Tag $env:TAG -Commit $env:GITHUB_SHA -Part gamemode -Files $gm, $stamp, $tables -BotFiles $bot -ServerZip $env:SERVER_ZIP -Add $adds -LauncherVersion $env:LAUNCHER_VERSION -NoCatalog
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $m = Get-Content -LiteralPath (Join-Path $probe 'files\manifest.json') -Raw | ConvertFrom-Json
          $prev = if ($env:PREVIOUS_MANIFEST) { Get-Content -LiteralPath $env:PREVIOUS_MANIFEST -Raw | ConvertFrom-Json } else { $null }
          $changed = @(Get-MergeReleaseChanged -Manifest $m -Previous $prev)
          Remove-Item -LiteralPath $probe -Recurse -Force
          if ($changed.Count -eq 0) {
            Write-Host 'no part changed since the Release before, so nothing is released'
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'No part changed since the Release before: nothing was released and nothing was deployed.'
          } else { Write-Host ('changed: ' + ($changed -join ', ')) }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("parts=" + ($changed -join ','))
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("release=" + $(if ($changed.Count) { 'yes' } else { 'no' }))
          # The launcher step made the same call before it built anything
          # (Test-MergeReleaseVelopack, from the same prints); a launcher built
          # for no package, or a package with a carried launcher, would break
          # the one number, so a disagreement stops the run.
          $velopack = $(if ($changed -contains 'launcher' -or $changed -contains 'game') { 'yes' } else { 'no' })
          if ($velopack -ne $env:LAUNCHER_BUILT) { Write-Host "::error::the parts say velopack=$velopack and the launcher step said built=$($env:LAUNCHER_BUILT)"; exit 1 }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("velopack=" + $velopack)
          # Where each changed part runs (header, WHAT CHANGED): the site and
          # the bot have environments of their own, and everything else is dev.
          $apps = @($changed | Where-Object { $_ -in 'site', 'discord' })
          $dev = @($changed | Where-Object { $_ -notin 'site', 'discord' })
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("dev=" + $(if ($dev.Count) { 'yes' } else { 'no' }))
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("apps=" + ($apps -join ','))
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("gamemode=" + $gm)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("stamp=" + $stamp)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("tables=" + $tables)

      # What the install reads beside the game files on the first start
      # (Build-SetupFiles.ps1), from the record the game files were built
      # over, once for each channel's package: config.json and applied.txt
      # are the channel's own.
      - name: Build the files the install reads beside the game files
        id: setup
        if: ${{ steps.changed.outputs.velopack == 'yes' }}
        shell: pwsh
        run: |
          foreach ($ch in 'dev', 'main') {
            $out = Join-Path $env:RUNNER_TEMP "setup-$ch"
            ./scripts/release/Build-SetupFiles.ps1 -Out $out -GameRoot (Join-Path $env:RUNNER_TEMP 'game-root') -Channel $ch -Commit $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::Build-SetupFiles.ps1 -Channel $ch failed; the lines above say why"; exit 1 }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("${ch}_dir=" + (Join-Path $out 'files'))
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("${ch}_list=" + (Join-Path $out "setup-files.$ch.json"))
          }

      # One package for each channel, from the same launcher and game files
      # (header, WHAT A RELEASE CARRIES): dev's goes out with this Release,
      # main's is held for Patrick's approval (#5181). The launcher's
      # programs come signed from the launcher step; Velopack's own
      # (Update.exe, the stub and Setup.exe) are signed through
      # Sign-OnRunner.ps1 one at a time; the game files and the setup files
      # are never signed (their bytes are the ones the signed lists name).
      # Setup.exe goes out as Thornswood-Dev-Setup.exe for dev and is held as
      # Thornswood-Setup.exe for main, the download; the portable copy vpk
      # also makes is not published.
      - name: Pack the launcher and the game files with Velopack
        id: velopack
        if: ${{ steps.changed.outputs.velopack == 'yes' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          VERSION: ${{ steps.names.outputs.velopack }}
          LAUNCHER_DIR: ${{ steps.launcher.outputs.dir }}
          GAME_ZIP: ${{ steps.game.outputs.zip }}
          SETUP_DEV_DIR: ${{ steps.setup.outputs.dev_dir }}
          SETUP_DEV_LIST: ${{ steps.setup.outputs.dev_list }}
          SETUP_MAIN_DIR: ${{ steps.setup.outputs.main_dir }}
          SETUP_MAIN_LIST: ${{ steps.setup.outputs.main_list }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'vpk'
          dotnet tool install vpk --version $env:VPK_VERSION --tool-path $tools
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::vpk $($env:VPK_VERSION) could not be installed"; exit 1 }
          $vpk = Join-Path $tools 'vpk.exe'
          $game = Join-Path $env:RUNNER_TEMP 'velopack-game'
          Expand-Archive -LiteralPath $env:GAME_ZIP -DestinationPath $game
          $sign = 'pwsh -NoProfile -File "' + (Resolve-Path 'scripts\release\Sign-OnRunner.ps1').Path + '" -Path {{file}}'
          $icon = (Resolve-Path 'launcher\app.ico').Path
          $raw = gh api "repos/$($env:GITHUB_REPOSITORY)/releases?per_page=50"
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::GitHub did not list the Releases'; exit 1 }
          $rels = @(($raw -join "`n") | ConvertFrom-Json)
          # The move program (launcher\move\Program.cs): what a launcher from
          # before Velopack takes as its last update, which installs this
          # channel's launcher and removes the old one. Built once, signed like
          # every program here, and put beside each channel's Setup.exe; the
          # site names it in that channel's old feed (site\lib\feed.js,
          # feedMove).
          $moveOut = Join-Path $env:RUNNER_TEMP 'move'
          dotnet build launcher\move\Move.csproj -c Release -p:Version=$env:VERSION -p:OutDir="$moveOut\"
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::the move program did not build'; exit 1 }
          $moveExe = Join-Path $moveOut 'Thornswood.exe'
          ./scripts/release/Sign-OnRunner.ps1 -Path $moveExe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $made = @{}
          foreach ($ch in 'dev', 'main') {
            $pack = Join-Path $env:RUNNER_TEMP "velopack-in-$ch"
            $out = Join-Path $env:RUNNER_TEMP "velopack-out-$ch"
            New-Item -ItemType Directory -Force -Path $pack, $out | Out-Null
            # The launcher's whole folder, built for this version (the step's
            # VERSION is the one Build-Launcher took as -Version), and Game.
            Get-ChildItem -LiteralPath $env:LAUNCHER_DIR -File | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $pack $_.Name) }
            Copy-Item -LiteralPath $game -Destination (Join-Path $pack 'Game') -Recurse
            # Beside Game, what the install reads on the first start
            # (InstallSteps.cs): config.json, profile\, applied.txt, the
            # source note and the licence texts, this channel's.
            $setupDir = $(if ($ch -eq 'dev') { $env:SETUP_DEV_DIR } else { $env:SETUP_MAIN_DIR })
            $setupList = $(if ($ch -eq 'dev') { $env:SETUP_DEV_LIST } else { $env:SETUP_MAIN_LIST })
            Copy-Item -Path (Join-Path $setupDir '*') -Destination $pack -Recurse
            # Dev: a delta from the Velopack release before, when there is
            # one; vpk takes its full package and feed into the output folder
            # first. Main: always the full package. Main's package goes out
            # only when Patrick approves a build, and he may approve any of
            # them, so a delta made now from whatever main had would not be
            # from what main has then; Velopack would take the full package
            # anyway.
            $delta = 'None'
            if ($ch -eq 'dev') {
              $before = @($rels | Where-Object { -not $_.draft -and @($_.assets | Where-Object name -eq 'releases.dev.json').Count })
              if ($before.Count) {
                & $vpk download github --repoUrl "https://github.com/$($env:GITHUB_REPOSITORY)" --channel dev --pre --token $env:GH_TOKEN -o $out
                if ($LASTEXITCODE -ne 0) { Write-Host "::error::vpk could not take the Velopack release before ($($before[0].tag_name)) for a delta"; exit 1 }
                $delta = 'BestSpeed'
                Write-Host "dev: a delta from $($before[0].tag_name)"
              } else { Write-Host 'dev: the first Velopack release, a full package and no delta' }
            } else { Write-Host 'main: a full package, held for the approval' }
            # packTitle is the name Windows shows in Apps and on the
            # shortcuts, packAuthors the publisher beside it, and the icon is
            # Setup.exe's and the installed app's.
            & $vpk pack --packId Thornswood --packVersion $env:VERSION --packDir $pack --mainExe Thornswood.exe --packTitle Thornswood --packAuthors Thornswood `
              --icon $icon --channel $ch --outputDir $out --skipVeloAppCheck --delta $delta --releaseNotes $env:NOTES `
              --signTemplate $sign --signExclude '[\\/]Game[\\/]' --signParallel 1
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::vpk pack for $ch failed; the lines above say why"; exit 1 }
            # This version's packages and the channel's feed files; a full
            # package of the release before, which vpk took for the delta,
            # stays on that Release.
            $files = @(Get-ChildItem -LiteralPath $out -File | Where-Object {
              $_.Name -in "releases.$ch.json", "assets.$ch.json", "RELEASES-$ch" -or $_.Name -like "Thornswood-$($env:VERSION)-$ch-*.nupkg" })
            if (@($files | Where-Object Name -like '*-full.nupkg').Count -ne 1) { Write-Host "::error::vpk made no full $ch package for $($env:VERSION)"; exit 1 }
            # Setup.exe, signed by vpk through Sign-OnRunner.ps1 like the
            # rest. Main's has the name the download has had since the first
            # installer; dev's says it is dev's, and the names in one Release
            # record are unique.
            $setupExe = @(Get-ChildItem -LiteralPath $out -File -Filter '*-Setup.exe')
            if ($setupExe.Count -ne 1) { Write-Host "::error::vpk made $($setupExe.Count) Setup.exe files for $ch $($env:VERSION), and one is the download"; exit 1 }
            $download = Join-Path $out $(if ($ch -eq 'dev') { 'Thornswood-Dev-Setup.exe' } else { 'Thornswood-Setup.exe' })
            Move-Item -LiteralPath $setupExe[0].FullName -Destination $download -Force
            $files += Get-Item -LiteralPath $download
            $move = Join-Path $out $(if ($ch -eq 'dev') { 'Thornswood-Dev-Move.exe' } else { 'Thornswood-Move.exe' })
            Copy-Item -LiteralPath $moveExe -Destination $move -Force
            $files += Get-Item -LiteralPath $move
            $files += Get-Item -LiteralPath $setupList
            $made[$ch] = $files
            Write-Host ("${ch}: " + (($files | ForEach-Object { $_.Name }) -join ', '))
          }
          # Dev's in the part velopack, published with the Release; main's in
          # the part main, which New-SignedManifest.ps1 lists and holds.
          $lines = @($made['dev'] | ForEach-Object { 'velopack=' + $_.FullName }) + @($made['main'] | ForEach-Object { 'main=' + $_.FullName })
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'velopack.txt') -Value $lines

      - name: Write the manifest
        id: files
        if: ${{ steps.changed.outputs.release == 'yes' }}
        shell: pwsh
        env:
          TAG: ${{ steps.names.outputs.tag }}
          VERSION: ${{ steps.names.outputs.velopack }}
          SERVER_ZIP: ${{ steps.server.outputs.zip }}
          LAUNCHER_VERSION: ${{ steps.launcher.outputs.version }}
          GAMEMODE: ${{ steps.changed.outputs.gamemode }}
          STAMP: ${{ steps.changed.outputs.stamp }}
          TABLES: ${{ steps.changed.outputs.tables }}
        run: |
          $rel = Join-Path $env:RUNNER_TEMP 'merge-release'
          $bot = @(@('Bot-Pass.js', 'bot.js', 'character.js', 'relay.js') | ForEach-Object { Join-Path 'scripts\bot' $_ }) + @(@('voice-server.js', 'headlines.js') | ForEach-Object { Join-Path 'voice' $_ })
          $adds = @(Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'parts.txt'))
          $vp = Join-Path $env:RUNNER_TEMP 'velopack.txt'
          if (Test-Path -LiteralPath $vp) { $adds += @(Get-Content -LiteralPath $vp) }
          ./scripts/release/New-SignedManifest.ps1 -Out $rel -Tag $env:TAG -Commit $env:GITHUB_SHA -Version $env:VERSION -Part gamemode -Files $env:GAMEMODE, $env:STAMP, $env:TABLES -BotFiles $bot -ServerZip $env:SERVER_ZIP -Add $adds -LauncherVersion $env:LAUNCHER_VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("dir=" + $rel)
          # The attestation's file pattern, in forward slashes, which the
          # action's glob reads the same on every runner.
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("subjects=" + $rel.Replace('\', '/') + '/assets/*')
          # Main's package, listed in the manifest and held for the approval
          # (New-SignedManifest.ps1, THE PART "main" IS HELD).
          $held = Join-Path $rel 'held'
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("held=" + $(if (Test-Path -LiteralPath $held) { $held } else { '' }))
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("held_subjects=" + $held.Replace('\', '/') + '/*')

      - name: Sign the catalog
        if: ${{ steps.changed.outputs.release == 'yes' }}
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          DIR: ${{ steps.files.outputs.dir }}
        run: |
          ./scripts/release/Sign-OnRunner.ps1 -Path (Join-Path $env:DIR 'manifest.cat')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $st = [string](Test-FileCatalog -CatalogFilePath (Join-Path $env:DIR 'manifest.cat') -Path (Join-Path $env:DIR 'files'))
          if ($st -ne 'Valid') { Write-Host "::error::the signed catalog does not hold manifest.json (Test-FileCatalog said $st)"; exit 1 }
          Copy-Item -LiteralPath (Join-Path $env:DIR 'manifest.cat') -Destination (Join-Path $env:DIR 'assets\manifest.cat')

      # One provenance attestation over every file the Release carries, and
      # one over main's held files, which the approval publishes (#5181).
      - name: Attest every file of the Release
        if: ${{ steps.changed.outputs.release == 'yes' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.subjects }}

      - name: Attest main's held files
        if: ${{ steps.changed.outputs.release == 'yes' && steps.files.outputs.held != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.held_subjects }}

      # Main may have moved on while this was built. A newer merge that this
      # workflow runs for would have cancelled this run (concurrency, above),
      # so getting here past main means the merges after it touched none of
      # the paths above and start no run of their own. Until 2 Nov this step
      # said a newer run would release the change anyway, and none did: the
      # site fix #5451 (ed6dfc99) was built, then dropped, because a voice
      # harness and a docs page merged during its build. So it asks for a
      # run of main's newest merge now, which carries this one's changes,
      # and that run is the one released (#5398, Patrick's A).
      - name: Is this still main's newest merge
        id: newest
        if: ${{ steps.changed.outputs.release == 'yes' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = gh api "repos/$($env:GITHUB_REPOSITORY)/commits/main" --jq .sha
          if ($LASTEXITCODE -ne 0 -or -not $head) { Write-Host '::error::GitHub did not say what main is'; exit 1 }
          if ([string]$head -eq $env:GITHUB_SHA) { Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'release=yes'; exit 0 }
          gh workflow run merge-release.yml --repo $env:GITHUB_REPOSITORY --ref main
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::main is $head now, past this merge, and the run that releases it could not be started"; exit 1 }
          Write-Host "main is $head now, past this merge; a run of main's newest merge was started, and it releases this one's changes"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Main moved on to $head while this was built, so a run of main's newest merge was started to release these changes; nothing was released here."
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'release=no'

      - name: Publish the Release
        if: ${{ steps.newest.outputs.release == 'yes' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.names.outputs.tag }}
          DIR: ${{ steps.files.outputs.dir }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          $assets = Get-ChildItem -LiteralPath (Join-Path $env:DIR 'assets') -File | ForEach-Object { $_.FullName }
          gh release create $env:TAG --draft --prerelease --target $env:GITHUB_SHA --title "Release $($env:TAG)" --notes-file $env:NOTES --latest=false
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the draft $($env:TAG) could not be made"; exit 1 }
          gh release upload $env:TAG @assets
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the files could not go on the draft $($env:TAG)"; exit 1 }
          gh release edit $env:TAG --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the draft $($env:TAG) could not be published"; exit 1 }

      # Main's package is never published here (header, MAIN'S PACKAGE): it
      # is kept with this run, under main-<tag>, for promote-main.yml
      # (#5181) to publish on a Release of its own once Patrick approves a
      # promotion that runs with it. Kept once the Release is out, so it is
      # never there for a Release that is not. Already compressed, so stored
      # as it is.
      - name: Keep main's package for the approval
        if: ${{ steps.newest.outputs.release == 'yes' && steps.files.outputs.held != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: main-${{ steps.names.outputs.tag }}
          path: ${{ steps.files.outputs.held }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Ask the dev server for it (a Deployment to Dev)
        if: ${{ steps.newest.outputs.release == 'yes' && steps.changed.outputs.dev == 'yes' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.names.outputs.tag }}
          PARTS: ${{ steps.changed.outputs.parts }}
        run: |
          # required_contexts empty: this commit is on main already, past its
          # checks, and the Deployment must not wait on whatever else runs.
          $body = [ordered]@{
            ref = $env:GITHUB_SHA
            task = 'deploy'
            environment = 'Dev'
            auto_merge = $false
            required_contexts = @()
            production_environment = $false
            transient_environment = $false
            payload = [ordered]@{ release = $env:TAG }
            description = "Release $($env:TAG) to dev ($($env:PARTS))"
          }
          $file = Join-Path $env:RUNNER_TEMP 'deployment.json'
          [IO.File]::WriteAllText($file, ($body | ConvertTo-Json -Depth 4 -Compress))
          $id = gh api --method POST "repos/$($env:GITHUB_REPOSITORY)/deployments" --input $file --jq .id
          if ($LASTEXITCODE -ne 0 -or -not $id) { Write-Host '::error::GitHub made no Deployment'; exit 1 }
          Write-Host "Deployment $id asks Dev for $($env:TAG); the box deploy agent applies it and says how it went on it"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Deployment $id asks **Dev** for **$($env:TAG)** (changed: $($env:PARTS)): https://github.com/$($env:GITHUB_REPOSITORY)/deployments"

      # One Deployment for each app that changed, with the part beside the
      # tag (header, THE DEPLOYMENT). The box deploy agent applies each and
      # the bot posts the Release's news once, in the dev updates channel,
      # however many places it reached.
      - name: Ask the site and the Discord bot for it (Deployments to Site and Discord bot)
        if: ${{ steps.newest.outputs.release == 'yes' && steps.changed.outputs.apps != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.names.outputs.tag }}
          APPS: ${{ steps.changed.outputs.apps }}
        run: |
          $where = @{ site = 'Site'; discord = 'Discord bot' }
          foreach ($part in ($env:APPS -split ',')) {
            $environment = $where[$part]
            if (-not $environment) { Write-Host "::error::$part has no environment of its own"; exit 1 }
            # The live site and the live bot: production, and never transient.
            $body = [ordered]@{
              ref = $env:GITHUB_SHA
              task = 'deploy'
              environment = $environment
              auto_merge = $false
              required_contexts = @()
              production_environment = $true
              transient_environment = $false
              payload = [ordered]@{ release = $env:TAG; part = $part }
              description = "Release $($env:TAG): $part"
            }
            $file = Join-Path $env:RUNNER_TEMP "deployment-$part.json"
            [IO.File]::WriteAllText($file, ($body | ConvertTo-Json -Depth 4 -Compress))
            $id = gh api --method POST "repos/$($env:GITHUB_REPOSITORY)/deployments" --input $file --jq .id
            if ($LASTEXITCODE -ne 0 -or -not $id) { Write-Host "::error::GitHub made no Deployment to $environment"; exit 1 }
            Write-Host "Deployment $id asks $environment for the $part of $($env:TAG)"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Deployment $id asks **$environment** for **$($env:TAG)** ($part): https://github.com/$($env:GITHUB_REPOSITORY)/deployments"
          }
