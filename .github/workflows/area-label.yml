# A new issue gets an area: label, or "area: triage" when its title does not
# say which part of the project it is (#2798).
#
# WHY. The weekly review of 19 Oct 2026 found 21 open issues with no labels at
# all and 39 more with no area:, and the board review of 21 Oct (#3192) found
# over 60 open issues with none. Nothing asked for one when an issue was made,
# by hand or by a lane, so an issue could sit unsorted with nobody knowing
# whose it was. Patrick approved this on the board review page, 21 Oct.
#
# WHAT IT DOES. When an issue is opened with no area: label, it reads the
# title against the table below. When exactly one area matches, that area's
# label goes on. When none or more than one match, "area: triage" goes on, so
# a person picks, and the label list shows what is waiting to be sorted. A
# guess between two areas is never made. Started by hand, it does the same
# for every open issue with no area: label. "area: triage" is made the first
# time it is needed. It checks out nothing and runs no action, and the title
# reaches the script through the environment, never pasted into it.
#
# WHERE IT RUNS. On GitHub's Windows runner (#3685, #4983). Opening an issue
# is something anyone can do on a public repository, so this job never
# reaches the box that runs the live game. The job starts only for an issue
# with no area: label, and takes a few seconds.
name: Area label on new issues
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  area:
    name: Put on an area label
    # Main only (#3550): a dispatch on a branch skips it, so only main's code
    # runs with this job's token.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !contains(join(github.event.issue.labels.*.name, '|'), 'area:')) }}
    runs-on: windows-latest
    # One call per issue, or a page of issues when started by hand.
    timeout-minutes: 5
    steps:
      - name: Read the title and label the issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          $ErrorActionPreference = 'Stop'
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $triage = 'area: triage'
          # Words in a title that name one part of the project, matched as
          # whole words in any case, in the plural too (s or es), with a space
          # or a hyphen between the words of a phrase. Only words that mean that
          # part and nothing else; an ordinary word that could be any part stays
          # out. The labels are exactly the areas docs/guide/the-board.md lists
          # under "Area labels", and tests/test-4144-area-labels.ps1 holds this
          # table to that list and to real titles with the areas people gave
          # them (#4144).
          function Words {
            $w = @($args | ForEach-Object { [regex]::Escape([string]$_) -replace '\\ ', '[\s-]+' })
            return '\b(?:' + ($w -join '|') + ')(?:s|es)?\b'
          }
          $areas = [ordered]@{
            'area: Accessibility' = (Words 'accessibility' 'accessible' 'keyboard' 'screen reader' 'high contrast' 'text size' 'reduced motion' 'skip link' 'image description')
            'area: Client'        = (Words 'in-game panel' 'front plugin' 'emote plugin' 'main menu' 'start screen' 'look prompt')
            'area: Content'       = (Words 'content' 'esp' 'npc catalogue' 'record count' 'masters check')
            'area: Discord'       = (Words 'discord' 'bot' 'ticket' 'welcome card' 'join card' 'slash command' 'forum post')
            'area: Docs'          = (Words 'doc' 'docs' 'documentation' 'readme' 'developer guide' 'table of contents' 'help text')
            'area: Engine'        = (Words 'engine' 'skymp' 'upstream' 'enchant' 'enchantment' 'enchanted')
            'area: Gamemode'      = (Words 'gamemode' 'quest' 'trade' 'guild' 'perk' 'killmove' 'join pass' 'drop box')
            'area: GitHub & CI'   = (Words 'github' 'ci' 'workflow' 'harness' 'nightly' 'dependabot' 'merge queue' 'gate share' 'artifact' 'action pin' 'labeller' 'pull request' 'runner')
            'area: In-game'       = (Words 'in-game help' 'craft' 'crafting' 'recipe' 'bench' 'forge' 'alchemy' 'harvest' 'cooking' 'mining' 'pickaxe' 'courier' 'parcel' 'contract' 'apprentice' 'profession')
            'area: Launcher'      = (Words 'launcher' 'installer' 'setup' 'setup window' 'uninstall' 'reinstall' 'downgrade' 'play now' 'scan and fix')
            'area: Legal'         = (Words 'legal' 'licence' 'license' 'privacy' 'permission' 'terms page' 'third-party' 'provenance')
            'area: Load order'    = (Words 'load order' 'plugins.txt' 'light plugin' 'light flag' 'esl' 'missing masters' 'check-manifest')
            'area: Moderation'    = (Words 'moderation' 'ban' 'banned' 'silence' 'silenced' 'frozen')
            'area: Mods'          = (Words 'mod' 'nexus' 'vortex' 'collection')
            'area: Operations'    = (Words 'vps' 'the box' 'watchdog' 'backup' 'restore' 'bridge' 'outage' 'availability' 'build machine')
            'area: Packaging'     = (Words 'packaging' 'unpack' 'zip' 'virustotal')
            'area: Performance'   = (Words 'performance' 'every frame' 'lag' 'stylesheet' 'kb' 'ms')
            'area: Release'       = (Words 'release' 'ship' 'rollback' 'scrub')
            'area: Security'      = (Words 'security' 'secure' 'dnssec' 'cloudflare' 'advisory' 'advisories' 'vulnerability' 'secret' 'token' 'noreply')
            'area: Server'        = (Words 'merchant session' 'tick')
            # A test, but not a test task, which is how a fix is checked in game.
            'area: Testing'       = '\b(?:tests?|untested|flaky)\b(?![\s-]+tasks?\b)'
            'area: Tools'         = (Words 'script' 'lint' 'one-off' 'builder' 'run-onbox')
            'area: Voice'         = (Words 'voice' 'websocket' 'emote' 'caption' 'voice-server')
            'area: Website'       = (Words 'website' 'site' 'hub' 'staff hub' 'sign-in' 'sign out' 'gallery' 'downloads page' 'home page' 'front page' 'visitor' 'thornswood.net' 'api')
            'area: World'         = (Words 'npc' 'carriage' 'ferry' 'storm' 'weather' 'horse' 'guard' 'bounty' 'bounties')
          }
          function Has($o, [string]$n) { return ($null -ne $o -and $o.PSObject.Properties[$n] -and $null -ne $o.$n) }
          function Pick([string]$title) {
            $hit = @($areas.Keys | Where-Object { $title -match ('(?i)' + $areas[$_]) })
            if ($hit.Count -eq 1) { return $hit[0] }
            return $triage
          }
          $todo = @()
          if ($env:EVENT -eq 'workflow_dispatch') {
            $page = 1
            do {
              # Through ForEach-Object so a page is one issue per item: Invoke-RestMethod
              # hands a JSON array on as one object, and @() alone kept the whole page
              # as a single item (#2798).
              $got = @(Invoke-RestMethod -Method Get -Uri ("$api/issues?state=open&per_page=100&page=" + $page) -Headers $h | ForEach-Object { $_ })
              $todo += @($got | Where-Object { -not (Has $_ 'pull_request') -and @($_.labels | Where-Object { $_.name -like 'area:*' }).Count -eq 0 } | ForEach-Object { [pscustomobject]@{ n = [int]$_.number; t = [string]$_.title } })
              $page++
            } while ($got.Count -eq 100)
          } else {
            $todo = @([pscustomobject]@{ n = [int]$env:ISSUE; t = [string]$env:TITLE })
          }
          Write-Host ("{0} issue(s) with no area label" -f $todo.Count)
          $made = $false
          foreach ($i in $todo) {
            $label = Pick $i.t
            if ($label -eq $triage -and -not $made) {
              try { Invoke-RestMethod -Method Get -Uri ("$api/labels/" + [Uri]::EscapeDataString($triage)) -Headers $h | Out-Null }
              catch {
                $r = $_.Exception.Response
                if (-not ($r -and [int]$r.StatusCode -eq 404)) { throw }
                Invoke-RestMethod -Method Post -Uri "$api/labels" -Headers $h -Body (@{ name = $triage; color = 'ededed'; description = 'No area yet: the title did not say which part of the project. A person picks one.' } | ConvertTo-Json -Compress) -ContentType 'application/json' | Out-Null
                Write-Host "made the label $triage"
              }
              $made = $true
            }
            Invoke-RestMethod -Method Post -Uri ("$api/issues/" + $i.n + '/labels') -Headers $h -Body (@{ labels = @($label) } | ConvertTo-Json -Compress) -ContentType 'application/json' | Out-Null
            Write-Host ("#{0}: {1}" -f $i.n, $label)
          }
