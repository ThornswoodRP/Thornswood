# GENERATED from build.yml by scripts/dev/Build-PrWorkflow.js. Do not edit:
# change build.yml and run  node scripts/dev/Build-PrWorkflow.js
#
# Every pull request runs the same checks as build.yml, on GitHub's hosted
# runners, Windows and Linux (#1306, #4983), and again on the merge queue's
# merge of it onto the newest main (#5182). No secrets, no live folders: every
# scratch path is under RUNNER_TEMP. The job keeps the name "Launcher builds",
# and the gate runs beside it in shares, "Gate harnesses (n of 5)", after
# the job "Pick the gate harnesses" says what each runs, and the harnesses
# that need nothing from Windows in "Gate harnesses on Linux (n of 4)".
# Main's ruleset requires three checks: "Build check result", the last job
# here, "Test tasks in the pull request" and "Release note"
# (records\github-repo-settings.json). build.yml's header says the rest.
name: Build check (pull requests)
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
# One run per branch at a time. On main a newer push waits for the run in
# progress and does not cancel it (#3874): every main build traces the gate
# (#3114), and pull requests choose their harnesses from the newest trace.
# When each merge cancelled the build before it, no main build finished in a
# busy hour, the trace fell behind, and from 4:59 PM on 26 Oct every pull
# request ran all 608 harnesses, 8.5 minutes of a build runner for a one line
# change to ops/status.md (run 40418651976). A third push still drops the one
# waiting, so at most one main build runs and the newest is next. A pull
# request's newer push cancels its older run (build-pr.yml): nothing reads a
# pull request's trace.
concurrency:
  group: build-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # THE GATE, IN FIVE SHARES (31 Oct 2026). Every gate harness, split over
  # five of GitHub's hosted Windows runners at once, beside the launcher job.
  # Since #5119 no build runs on the box, and every pull request ran the
  # whole gate on one runner's four cores: 707 harnesses, 3741 s of
  # processor, the gate step 1104 s of a 20.7 minute build (run 41231641217),
  # and 1186 s of 21 minutes on a slower runner (41233444404, 4061 s of
  # processor for the same harnesses). Patrick's mark is under ten minutes
  # for a pull request's checks, and over twenty means something is wrong.
  # The runners are free on a public repository; each share costs about a
  # minute to start. Of the checks main's ruleset requires, "Build check
  # result" needs this job and the launcher job both
  # (scripts\dev\Build-PrWorkflow.js).
  #
  # THE PICK (#5183). One job first, on Linux, picks what the shares run and
  # splits it (scripts\dev\Run-Gate.ps1 -Pick): on a pull request the
  # harnesses its change can reach, from main's newest nightly map
  # (gate-map.yml traces the whole gate on GitHub's Windows runner and keeps
  # it as an artifact; Gate-Map.ps1 -Fetch reads it with this job's token,
  # actions: read), each with why in its log; on main the whole gate. The
  # split is by the seconds each harness took when traced, so the shares end
  # together. Every share runs its part of that one plan; a share fetching
  # the map for itself could read a different one, or none, and a harness
  # would run twice or not at all. With no map the pull request runs the
  # whole gate, split by place in the list. How many shares there are is
  # SHARES below, and nowhere else: at most that many, one for each harness
  # when the change reaches fewer, and none when it reaches none, and then
  # the job "gate" is skipped and starts no Windows runner (#5292).
  # It stays on x64 Linux: on GitHub's arm64 runner (#5302, 1 Nov 2026) it
  # waited 22 s longer for a runner than the x64 Linux jobs started by the
  # same push (median of 31), longer in 20 of them, and it holds up every
  # share.
  pick:
    name: Pick the gate harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
      shares: ${{ steps.pick.outputs.shares }}
      linux_shares: ${{ steps.pick.outputs.linux_shares }}
      whole: ${{ steps.pick.outputs.whole }}
      launcher: ${{ steps.reach.outputs.launcher }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Pick and split the gate harnesses
        id: pick
        shell: pwsh
        env:
          SHARES: '5'
          # #5293: the harnesses the nightly map says run as fully on Linux
          # as on Windows go to this many shares on ubuntu-latest instead.
          LINUX_SHARES: '4'
          GATE_MAP_TOKEN: ${{ github.token }}
        run: |
          ./scripts/dev/Run-Gate.ps1 -Pick ([int]$env:SHARES) -LinuxShares ([int]$env:LINUX_SHARES)
          exit $LASTEXITCODE
      # THE PATH RULE (#5292): whether the job "Launcher builds" has anything
      # to check, from the files the pull request changes against its base.
      # The job above its own says why.
      - name: Say whether the change reaches the launcher build
        id: reach
        shell: pwsh
        env:
          # A pull request's base only. The merge queue's run (#5296) gets
          # none, so it always builds the launcher and writes the note
          # main's "tested" job reads; skipped there, main would build
          # everything again after the merge.
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          ./scripts/dev/Launcher-Reach.ps1 -Base $env:BASE
          exit $LASTEXITCODE

  # Each share runs its part of the pick's plan. A share of what a change can
  # reach says so in its name, and scripts\dev\Tested-Tree.js counts a pull
  # request's tree as tested only when every share of its run passed and was
  # a share of the whole gate, so main runs the whole gate after a pull
  # request that ran less.
  gate:
    name: Gate harnesses (${{ matrix.shard }} of ${{ strategy.job-total }}${{ needs.pick.outputs.whole != 'true' && ', what the change reaches' || '' }})
    needs: pick
    if: ${{ needs.pick.outputs.shares != '[]' }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      # Every share runs to its end, so one red share does not hide what
      # the others would have found.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.pick.outputs.shares) }}
    steps:
      # Every commit and tree, no old file contents (about a second more than
      # a shallow one, measured 1 Nov 2026): the harnesses run the release
      # scripts on this checkout, and they work out the launcher's number
      # from when its sources last changed (scripts\release\LauncherVersion.ps1,
      # #5179), which a shallow checkout cannot say.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The harnesses compile and run launcher code with the .NET 10 SDK
      # (tests\Launcher-Csc.ps1, #4823), pinned as the launcher's publish is.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Run the gate harnesses
        id: gate
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
          OF: ${{ strategy.job-total }}
          GATE_PLAN: ${{ needs.pick.outputs.plan }}
        run: |
          # Issue #3009. The gate is every tests\test-*.js and tests\test-*.ps1
          # that tests\gate-excluded.txt does not name, read from the files by
          # scripts\dev\Gate-Harnesses.ps1 when this runs, in name order. It
          # was a hand-kept list here, and every pull request adding a harness
          # appended to its end, so any two of them conflicted in this file and
          # in build-pr.yml. A new harness is on the gate by being in tests\;
          # one comes off by a line in gate-excluded.txt with its reason; why
          # each one exists is in its own header. Name no harness in this step
          # or in Run-Gate.ps1: a name there is a second list
          # (test-gate-list.ps1 fails on one).
          # It began as six that sat red on main unseen (#875) and grew from
          # there (#1088, #1273, #2513).
          # On 21 Oct 2026 the 550 then on the gate took 26 minutes of a 28
          # minute build one at a time, in a foreach here (#3114). They run
          # through scripts\dev\Nightly-Harnesses.ps1 now, -Throttle at once:
          # each a process of its own with its output in files of its own,
          # printed as it ends, on the nightly's clock, in a job object that
          # counts its processor time. The summary says what the box's cores
          # did meanwhile. Beside four other builds on 21 Oct 2026 the 550
          # took 2110 s one at a time, 1112 s two at a time, 887 s at three and
          # 765 s at six, every one passing. Since 22 Oct two builds run at
          # once, not four (records\build-runners.json says why), and each
          # runs its share of the cores, three of six, whatever the box is
          # doing; past that, up to six, only into cores the box has free, so
          # a build alone uses the idle ones and two side by side share them
          # rather than one grabbing them (#3106's build got under one core
          # beside one at six, and ran out of time). A harness that writes
          # where another reads says RUNS ALONE in its header and runs after
          # the rest. tests\test-signer-check.ps1 and
          # tests\test-build-generated.ps1 had steps of their own after this
          # one (#2046, #1982), one after the other; they are on the gate
          # list and run beside the rest.
          # 1200 s of the job's 30 minutes: a harness starts only when its
          # whole clock still fits, so the list of what failed is printed
          # before the job could be cancelled. A share takes about five
          # minutes, so a share near its budget is a fault to find, and one
          # past it is red and names what did not run.
          # ONLY WHAT A CHANGE CAN REACH (#3114, #5183). scripts\dev\Run-Gate.ps1
          # runs this share's part of the plan the job "Pick the gate
          # harnesses" made, in GATE_PLAN, having checked it was made for
          # this many shares from this checkout's gate. It fetches no map.
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            Write-Host '::error::no node on this runner, so the .js gate harnesses were not run'
            exit 1
          }
          # ONE REPORT (#5295): each share writes a test case for every check
          # its harnesses printed, and the job "Gate report" merges the
          # shares' into one and names the failing checks on the run's page.
          .\scripts\dev\Run-Gate.ps1 -Shard $env:SHARD -Of $env:OF -Throttle 6 -BudgetSeconds 1200 -Report (Join-Path $env:RUNNER_TEMP 'gate-report\share.xml')
          exit $LASTEXITCODE

      - name: Keep this share's report for the gate report
        if: ${{ !cancelled() }}
        # The share's verdict is its harnesses'. When this upload fails, the
        # report job names this share as having left no report and is red,
        # so the failure is said where the report is read.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: gate-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/gate-report/share.xml
          if-no-files-found: ignore
          # Read by the report job of this run, minutes later, and by
          # nothing after it.
          retention-days: 1

  # THE LINUX SHARES (#5293). The gate harnesses the nightly map says need
  # nothing from Windows: each ran on both platforms the night the map was
  # made, passed on both, and skipped nothing on Linux that it ran on
  # Windows (scripts\dev\Affected-Harnesses.js, platforms). They run here, on
  # GitHub's ubuntu-latest, which starts sooner than its Windows runner; every
  # other harness, and every one when the map has no platforms file for its
  # commit, runs in the job above. Tested-Tree.js counts these shares with
  # the Windows ones.
  gate-linux:
    name: Gate harnesses on Linux (${{ matrix.shard }} of ${{ strategy.job-total }}${{ needs.pick.outputs.whole != 'true' && ', what the change reaches' || '' }})
    needs: pick
    if: ${{ needs.pick.outputs.linux_shares != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.pick.outputs.linux_shares) }}
    steps:
      # A full history for the same reason as the Windows shares.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The harnesses compile and run launcher code with the .NET 10 SDK
      # (tests\Launcher-Csc.ps1, #4823), pinned as the launcher's publish is.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Run the gate harnesses
        id: gate
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
          OF: ${{ strategy.job-total }}
          GATE_PLAN: ${{ needs.pick.outputs.plan }}
        run: |
          # This share's part of the plan's Linux shares, as the Windows
          # shares run theirs, report and all (the job above says how and why).
          ./scripts/dev/Run-Gate.ps1 -Shard $env:SHARD -Of $env:OF -Platform Linux -Throttle 6 -BudgetSeconds 1200 -Report (Join-Path $env:RUNNER_TEMP 'gate-report/share.xml')
          exit $LASTEXITCODE

      - name: Keep this share's report for the gate report
        if: ${{ !cancelled() }}
        # The share's verdict is its harnesses'. When this upload fails, the
        # report job names this share as having left no report and is red,
        # so the failure is said where the report is read.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: gate-report-linux-${{ matrix.shard }}
          path: ${{ runner.temp }}/gate-report/share.xml
          if-no-files-found: ignore
          # Read by the report job of this run, minutes later, and by
          # nothing after it.
          retention-days: 1


  # The gate's checks in one report (#5295). Each share above keeps a JUnit
  # file with a test case for every PASS, FAIL and SKIP line its harnesses
  # printed (scripts\dev\Nightly-Harnesses.ps1 -Report); this merges them
  # into one, kept with the run, and lists every failing check by harness
  # on the run's page, so a red gate says which check failed without anybody
  # opening a share's log. The Linux shares (#5293) keep theirs as
  # gate-report-linux-<n>, which the same pattern reads. A share that left no report is named, and turns
  # this red: its checks are missing from the report. Failing checks alone
  # do not, since the share that ran them is red already.
  report:
    name: Gate report
    needs: [pick, gate, gate-linux]
    if: ${{ !cancelled() && (needs.gate.result != 'skipped' || needs['gate-linux'].result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/dev/Merge-HarnessReports.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-report-*
          path: ${{ runner.temp }}/gate-reports
      - name: Merge the shares' reports into one
        shell: pwsh
        env:
          SHARES: ${{ needs.pick.outputs.shares }}
          LINUX_SHARES: ${{ needs.pick.outputs.linux_shares }}
        run: |
          # One report from each share that ran, Windows and Linux.
          $shares = @($env:SHARES | ConvertFrom-Json).Count + @($env:LINUX_SHARES | ConvertFrom-Json).Count
          $in = Join-Path $env:RUNNER_TEMP 'gate-reports'
          New-Item -ItemType Directory -Path $in -Force | Out-Null
          .\scripts\dev\Merge-HarnessReports.ps1 -Path $in -Expect $shares -Out (Join-Path $env:RUNNER_TEMP 'gate-report.xml') -Title 'Gate harnesses'
          exit $LASTEXITCODE
      - name: Keep the merged report with the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: gate-report
          path: ${{ runner.temp }}/gate-report.xml
          if-no-files-found: ignore
          retention-days: 14

  # THE TREE CHECKS (#5292). Every check of the whole tree that needs
  # nothing from Windows, on GitHub's ubuntu-latest, which starts sooner than
  # its Windows runner. They were steps of the launcher job until 1 Nov 2026,
  # where a change to one doc waited for a Windows runner to have them run.
  # Every pull request runs them, whatever it changes, and so does main.
  # Each step's own comment says why it is there.
  checks:
    name: Tree checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The hosted image ships whatever node and python it has this month;
      # these are pinned so a check means the same thing every month.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Scan the tree for secrets
        shell: pwsh
        run: |
          # Entry 236. Every tracked file, by the rules in scripts\dev\Check-Secrets.ps1.
          # A hit names the file, the line and the rule and never the value,
          # because anybody on the repository can read this log. A known
          # non-secret goes in scripts\dev\Check-Secrets.allow.txt with its reason.
          ./scripts/dev/Check-Secrets.ps1
          exit $LASTEXITCODE

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          # The list of what is parsed is in scripts\dev\Check-Parse.ps1, which
          # the pre-push hook runs too (#5291), so a script the hook passed
          # parses here as well.
          ./scripts/dev/Check-Parse.ps1 -What PowerShell
          exit $LASTEXITCODE

      - name: Check the writing rules
        shell: pwsh
        run: |
          # The Words section of docs/guide/rules.md, over every file people read
          # (every Markdown file outside lore and the archive, the launcher's
          # help and window, the bot's posts, the public pages, the installer's
          # read me). Written down since the start and never checked, and on
          # 24 September eleven hits had gone out in those files. Each hit is
          # marked on its line with the rule it breaks.
          #
          # Issue #460: then the two harnesses that prove the checks catch what
          # they should, this one and the release note check Ship runs
          # (tools\ReleaseNotes\NoteRules.cs), by planting a break of every rule.
          # A few seconds between them. They ran only at night before, and a
          # name in a component README sat red there for a day (#1034).
          ./scripts/dev/Check-Words.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $failed = @()
          # Issue #1081: Ship runs Check-Words before it builds. The harness
          # plants one hit in a temp tree and a dry-run Ship must stop and
          # name that hit.
          foreach ($n in 'test-check-words.ps1', 'test-note-rules.ps1', 'test-ship-check-words.ps1') {
            Write-Host ("--- {0}" -f $n)
            & pwsh -NoProfile -File (Join-Path 'tests' $n)
            if ($LASTEXITCODE -ne 0) { $failed += $n; Write-Host ("::error file=tests/{0}::a writing check let a planted break through or reported an allowed line; the FAIL lines above say which" -f $n) }
          }
          if ($failed.Count) { exit 1 }

      # The ownership page check (#752) went with docs/OWNERSHIP.md to the
      # private ops repository (#3693), which runs it against main every night.

      - name: Check the old mod's name stays out
        shell: pwsh
        run: |
          # Issue #497. The multiplayer mod this build replaced was taken out
          # of the whole tree on 28 September, after weeks of clean ups that
          # each found more because nothing failed when one came back. One
          # read of every tracked file, a second or two, so it runs here.
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            Write-Host '::error file=tests/test-old-name-gone.js::no node on this runner, so the old name was not checked'
            exit 1
          }
          node tests/test-old-name-gone.js
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=tests/test-old-name-gone.js::the old multiplayer mod is named again; the lines above say where'
            exit 1
          }

      - name: Check the other server's name stays out
        shell: pwsh
        run: |
          # Issue #400. Patrick, 12 October: the name of the SkyMP server
          # Thornswood-Content.esp was salvaged from goes from every file,
          # records, tests, docs\archive and the plugin included, and on
          # 15 October (decision C) its two short forms with it. One read of
          # every tracked file, text, plugins and binary, so it runs here.
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            Write-Host '::error file=tests/test-other-server-name-gone.js::no node on this runner, so the other server''s name was not checked'
            exit 1
          }
          node tests/test-other-server-name-gone.js
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=tests/test-other-server-name-gone.js::the other server or one of its short forms is named again; the lines above say where'
            exit 1
          }

      - name: Check the engine is one commit
        shell: pwsh
        run: |
          # Issue #1200. The commit engine\skymp is pinned to, the commit
          # records\client-build.json and records\server-build.json say the
          # two halves were built from must be one fork commit. On 29
          # September the server record was two days and several fixes behind
          # the pin and nothing said so, so the servers ran old engine code.
          # Reads only the checkout (the pin is the gitlink in HEAD's tree),
          # well under a second. Fail closed, like the steps above. It also
          # holds engine\README.md to naming no commit or hash in full, since
          # the page went stale twice copying the pin (issue #1346).
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            Write-Host '::error file=tests/test-one-engine.js::no node on this runner, so the engine commit was not checked'
            exit 1
          }
          node tests/test-one-engine.js
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=records/server-build.json::the engine pin and the client and server build records do not name one fork commit, or engine/README.md names a commit or hash in full; the lines above say which'
            exit 1
          }

      - name: Check the high-risk records
        shell: pwsh
        run: |
          # Issue #2180. records\server-build.json, client-build.json,
          # most-online.json and collection-plugins.json must each be a version
          # this checkout knows, with every field its readers depend on
          # (scripts\release\RecordShape.ps1). The deploys refuse a record that
          # is not; this says so at merge instead. Reads four files, under a
          # second. Fail closed, like the steps above.
          ./scripts/release/Check-Records.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=records/server-build.json::a high-risk record is at a version this checkout does not know, or is missing a field its readers need; the lines above say which'
            exit 1
          }

      - name: Check inactive merchant role data
        shell: pwsh
        run: |
          & python tests/test-merchant-role-data.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python tests/test-merchant-roster.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python tests/test-merchant-roster-activation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python scripts/dev/Build-MerchantRoleTables.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the bot's keeping times
        shell: pwsh
        run: |
          # Issue #2353: joins_age, ticket_past_keeping and age_closed_tickets
          # lifted out of bot\bot.py, no discord.py needed.
          & python tests/test-2353-join-keeping.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python tests/test-2353-ticket-keeping.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python tests/test-retrieval-source-reader.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check every Discord doc has its change line
        shell: pwsh
        run: |
          # Issue #3457: #3445 changed the words of four Discord docs, which are
          # read out of the join and rules pages, with no change line, and was
          # green, since check_docs ran only in the nightly's bot harnesses.
          # The fingerprints are in bot\content.py now, no discord.py needed.
          & python tests/test-3457-doc-change-lines.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the voice service's /health harness
        shell: pwsh
        run: |
          # Issue #2475. voice\tests\test-turn-key.js checks /health's fields, in
          # order, and #2677 broke it while this build stayed green, because
          # the harness list above runs only tests\ and voice\test-*.js ran
          # only at night. It starts the real service on a port of its own
          # (#1703), a few seconds.
          & node voice/tests/test-turn-key.js
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=voice/tests/test-turn-key.js::the voice /health harness failed, the FAIL lines above say what'
            exit 1
          }

      - name: Check NPC population policy
        shell: pwsh
        run: |
          & python tests/test-npc-population.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check our plugins are clean
        shell: pwsh
        run: |
          # Issue #2790. Our three plugins are written by scripts and change
          # most weeks; this is the half of SSEEdit's error and cleaning check
          # that needs no game: every record inside its group, sizes that add
          # up, no form id twice or past the plugin's own index, nothing
          # deleted. The identical-to-master half needs the masters, a game
          # folder: python scripts/mods/Check-PluginClean.py where one is.
          & python tests/test-2790-plugin-clean.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python scripts/mods/Check-PluginClean.py --no-masters
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=scripts/mods/Check-PluginClean.py::a plugin in game/content has a broken or deleted record; the lines above say which, and the cure is in the script that writes it'
            exit 1
          }

      - name: Check the launcher UI thread
        shell: pwsh
        run: |
          # Issue #1216. A Log() from a background thread throws on the
          # window, and the catch then reports a success as a failure.
          # Avalonia throws on a control touched off its thread just as WPF
          # did, so this stays (#4823), reading Avalonia's hand back,
          # Dispatcher.UIThread. The compiled window does not catch it: it is
          # a thread fault, not a name one.
          # This follows calls out of ThreadPool and Thread delegates in
          # launcher\app. No arguments: the script finds launcher\app from
          # where it lives. A finding exits 1. No python is a check that
          # did not happen, so it is red.
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            Write-Host '::error file=scripts/dev/Check-UiThread.py::no python on this runner, so the UI thread check did not run'
            exit 1
          }
          & python scripts/dev/Check-UiThread.py
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=scripts/dev/Check-UiThread.py::the launcher touches the window from a background thread; the lines above say where'
            exit 1
          }

      - name: Parse every game script
        shell: pwsh
        run: |
          # game\ since the reorganisation's phase 6 (issue #440): the gamemode,
          # the plugins and the overlays, with node --check. The list is in
          # scripts\dev\Check-Parse.ps1, which the pre-push hook runs too (#5291).
          ./scripts/dev/Check-Parse.ps1 -What Scripts
          exit $LASTEXITCODE

      - name: Check the Python names what exists
        shell: pwsh
        run: |
          # Issue #1343. A file that parses can still name something that does
          # not exist, and Python only finds out when that line runs: in the
          # bot, on the VPS, in front of people. ruff with four rule groups and
          # nothing else: E9 a file that will not compile, F63 a comparison
          # or assert that is always true or false, F7 a break, continue,
          # return or yield where none can be, F82 a name never defined.
          # No style rules, so no line here is red for how it looks. All 48
          # Python files passed on main on 5 October with nothing changed.
          # ruff also stops on a file that does not parse, whatever --select
          # says (a planted "def f(:" gave invalid-syntax, exit 1, on 22 Oct
          # 2026), so the step that parsed each bot file with Python's ast,
          # which this already covers, is gone (#3114). The nightly keeps it.
          # ruff comes into a venv of this run's own, never the machine's
          # Python, pinned by version and hash in .github\ruff-requirements.txt.
          # By hand, from the repository folder, into .venv (git ignores it).
          # With uv, which needs no python on the PATH (uv's own Python
          # refuses pip as "externally-managed", and a uv venv has no pip):
          #   uv venv .venv
          #   uv pip install --python .venv --only-binary :all: --require-hashes -r .github\ruff-requirements.txt
          # or with Python's own pip:
          #   python -m venv .venv
          #   .venv\Scripts\python -m pip install --only-binary :all: --require-hashes -r .github\ruff-requirements.txt
          # then:
          #   .venv\Scripts\ruff check --isolated --select E9,F63,F7,F82 (git ls-files '*.py')
          $venv = Join-Path $env:RUNNER_TEMP 'ruff-venv'
          python -m venv $venv
          $py = Join-Path (Join-Path $venv 'bin') 'python'
          if (-not (Test-Path -LiteralPath $py)) {
            Write-Host '::error::could not make a venv for ruff, so the Python was not checked'
            exit 1
          }
          & $py -m pip install --quiet --disable-pip-version-check --only-binary :all: --require-hashes -r .github/ruff-requirements.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=.github/ruff-requirements.txt::could not install the pinned ruff, so the Python was not checked'
            exit 1
          }
          $files = @(git ls-files '*.py')
          & $py -m ruff check --isolated --no-cache --select E9,F63,F7,F82 --output-format github @files
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host ("{0} Python file(s) name only what exists" -f $files.Count)

      # The steps after a deploy (#5186): each file under deploy/after held to
      # the rules the box deploy agent holds it to, against this tree's
      # verbs.json, with the agent's own code, so a step file that would be
      # refused on the box stops the merge instead. Only when there is one:
      # most changes carry none, and they skip the .NET set up.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: ${{ hashFiles('deploy/after/*.json') != '' }}
        with:
          dotnet-version: '10.0.x'
      - name: Check the steps after a deploy
        if: ${{ hashFiles('deploy/after/*.json') != '' }}
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          dotnet restore tools/DeployAgent --locked-mode
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::dotnet restore failed for tools/DeployAgent'; exit 1 }
          dotnet run --project tools/DeployAgent --no-restore -- steps --folder deploy/after --verbs scripts/vps/gate/verbs.json
          exit $LASTEXITCODE

      - name: Count the silent catches in the launcher, the scripts, the site, voice and the bot
        shell: pwsh
        run: |
          # Entry 239. A catch with nothing in it leaves no line in
          # launcher.log when it fires, and there were 386 of them on 24 Sep.
          # Since #2711 the PowerShell under scripts\ and installer\ is
          # counted too: two empty catches let New-ClientBuildRecord.ps1 write
          # a record over checks that never ran. Since #2736 the JavaScript
          # under site\ and voice\ and the Python under bot\ are counted as
          # well: an empty catch in the site's /api/play/logs handler lost a
          # session's crash note with nothing said. Red when any of those files
          # has more than
          # scripts\dev\swallow-baseline.txt allows, and since #756 red when a
          # file has fewer and its line has not been lowered with it, so the
          # lowering lands in the branch that made the count fall rather than
          # waiting for somebody to notice. The script says what to do.
          ./scripts/dev/Check-Swallow.ps1

      - name: Lint (warnings only)
        # Issue #1343. Reports ruff, eslint and PSScriptAnalyzer findings and
        # never fails the build: continue-on-error, and scripts\dev\Lint.ps1
        # always ends 0. #3185 (21 Oct 2026): it fetched eslint and
        # PSScriptAnalyzer into RUNNER_TEMP on every job and linted every
        # file, 35 s a build on average. Lint.ps1 keeps each pinned tool in
        # the runner account's own folder, named by its version, and a pull
        # request lints only the files it changed against its base, and so
        # does its run in the merge queue, against the queue's base (#5182);
        # main and a manual run lint everything, and so does the nightly. The
        # last step of its job, because it fetches the base commit: no check
        # after it reads git history.
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if ($env:BASE -match '^[0-9a-f]{40}$') {
            git fetch -q --depth=1 --no-tags origin $env:BASE
            $changed = @(git diff --name-only --diff-filter=d $env:BASE HEAD)
            if ($LASTEXITCODE -eq 0) { ./scripts/dev/Lint.ps1 -Files $changed; exit 0 }
            Write-Host "::warning::could not tell what this pull request changed against $env:BASE, so everything is linted"
          }
          ./scripts/dev/Lint.ps1 -All
          exit 0

  # The launcher build and the checks that need Windows, on GitHub's hosted
  # windows-latest (#1306; the only runner since #4983). Every other check of
  # the tree is in the job "Tree checks" on Linux (#5292).
  #
  # THE PATH RULE (#5292, decided 31 Oct 2026). A pull request that changes
  # only docs, the site or the bot cannot change what this job checks: the
  # launcher's project and the ship root tool read none of those folders
  # (the installer is the launcher's own code since #4824, and its window
  # compiled markup since #4823), and the writing check's harness runs in
  # "Tree checks" for every change (tests\test-5292-path-rule.ps1 holds all
  # of that). The pick says
  # so (scripts\dev\Launcher-Reach.ps1), and this job still runs and reports
  # a result of its own: on Linux, with one step that says why there is
  # nothing to build, and it passes. It is never skipped for the path rule,
  # so "Launcher builds" is a pass or a failure on every pull request, and a
  # skipped one means something went wrong (#5292, Magpie's finding of
  # 1 Nov 2026). Main and a run by hand always build. A pick that failed or
  # said nothing builds too.
  launcher:
    name: Launcher builds
    needs: pick
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.pick.outputs.launcher == 'false' && 'ubuntu-24.04-arm' || 'windows-latest' }}
    permissions:
      contents: read
    env:
      # What the pick said: 'false' only when the change reaches nothing
      # this job checks.
      REACHES: ${{ needs.pick.outputs.launcher }}
    # Its steps took about three minutes once the gate went to the job above,
    # and less since the tree checks went to Linux; twenty is Patrick's mark
    # for something seriously wrong.
    timeout-minutes: 20
    steps:
      - name: Say why there is nothing to build
        if: env.REACHES == 'false'
        run: |
          msg='This change touches only files under docs, site or bot, and nothing this job checks reads those folders (the pick ran scripts/dev/Launcher-Reach.ps1, #5292). So there is nothing to build, and this check passes.'
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      # One commit, no history: this job checks the tree alone (#3182), and
      # the publish below takes the number a bare build carries rather than
      # the one history gives a release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.REACHES != 'false'

      # The hosted image ships whatever node, python and .NET it has this
      # month; these are pinned so a check means the same thing every month.
      # The .NET 10 SDK publishes the launcher (#4823).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.REACHES != 'false'
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.REACHES != 'false'
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: env.REACHES != 'false'
        with:
          dotnet-version: '10.0.x'

      - name: Publish the native launcher
        if: env.REACHES != 'false'
        shell: pwsh
        run: |
          # Issue #4823. The launcher is Avalonia on .NET 10, published with
          # Native AOT for win-x64, and this publishes it the one way every
          # build does, scripts\release\Build-Launcher.ps1 (a Ship and a merge
          # release run the same script), unsigned, into RUNNER_TEMP. Red on
          # any compile error and on any trim or native code warning (IL2xxx,
          # IL3xxx), which the script refuses itself: each is code that can
          # fail in the native exe and never in a JIT build. The window is
          # compiled markup (launcher\app\MainWindow.axaml), so a renamed
          # control or a window that does not parse is a compile error here;
          # the check that read ui.xaml at run time (Check-Controls.ps1) went
          # with it. Until #4823 this step was tests\test-498-msbuild.ps1,
          # which held the MSBuild build of the .NET Framework launcher.
          # -Version 0.0.0, the number a bare build carries: this job checks
          # the tree alone (#3182, the note at the end), and the number a
          # release takes comes from history (LauncherVersion.ps1), which the
          # nightly's publish works out on a full checkout.
          $root = Join-Path $env:RUNNER_TEMP 'launcher'
          $out = Join-Path $root 'Launcher'
          & .\scripts\release\Build-Launcher.ps1 -Root $root -OutDir $out -NoSign -NoPause -Version 0.0.0
          if ($LASTEXITCODE -ne 0) { Write-Host '::error file=scripts/release/Build-Launcher.ps1::the launcher did not publish, or its publish gave a trim or native code warning; the lines above say which'; exit 1 }
          # The programs it made, byte by byte, by the rules in
          # scripts\dev\Check-Secrets.ps1 (a key or address compiled in is in
          # every copy people download). The step above has no other way to
          # look at them.
          $programs = @(Get-ChildItem -LiteralPath $out -File | Where-Object { $_.Extension -in '.exe', '.dll' } | ForEach-Object { $_.FullName })
          if (-not $programs.Count) { Write-Host '::error::the publish left no program to check'; exit 1 }
          .\scripts\dev\Check-Secrets.ps1 -Binary $programs
          if ($LASTEXITCODE -ne 0) { Write-Host '::error file=scripts/dev/Check-Secrets.ps1::a published launcher program carries something that must not ship; the lines above say which'; exit 1 }

      - name: Start the native launcher
        if: env.REACHES != 'false'
        shell: pwsh
        run: |
          # Issue #5524. The exe published above, started for real in a root
          # of its own under RUNNER_TEMP: its window must come up and it must
          # stay up with no COULD NOT START line in its log. On 8 Nov 2026 a
          # launcher that stopped at start went to dev and main because
          # nothing ever started the native exe; the window start harness
          # runs the window in .NET on the headless platform, not this.
          $exe = Join-Path $env:RUNNER_TEMP 'launcher\Launcher\Thornswood.exe'
          & .\scripts\release\Test-LauncherStarts.ps1 -Exe $exe
          if ($LASTEXITCODE -ne 0) { Write-Host '::error file=scripts/release/Test-LauncherStarts.ps1::the published launcher did not start and stay up; its log is above'; exit 1 }

      - name: Build the ship root tool
        if: env.REACHES != 'false'
        shell: pwsh
        run: |
          # Issue #2019. Every Ship builds Thornswood-ShipRoot.exe from
          # scripts\release\ShipRoot\ShipRoot.csproj, which compiles OwnGame
          # and the launcher files it calls, none of the window's, with its own
          # entry point, and runs it on the folder
          # the release is built from before anything is packed. A launcher
          # change that stops it compiling would stop every Ship, so it is
          # built here with the same .NET 10 SDK, as Update-ShipRoot.ps1
          # builds it; tests\test-2019-ship-roots.ps1 on the gate runs it on
          # a pretend root.
          $out = Join-Path $env:RUNNER_TEMP 'shiproot'
          dotnet build scripts\release\ShipRoot\ShipRoot.csproj -c Release -o $out --nologo -v minimal --disable-build-servers
          if ($LASTEXITCODE -ne 0) { throw "the ship root tool did not build (dotnet build exit $LASTEXITCODE)" }
          if (-not (Test-Path -LiteralPath (Join-Path $out 'Thornswood-ShipRoot.exe'))) { throw 'the ship root tool did not build: no Thornswood-ShipRoot.exe' }


      # The note main's build looks for (#3182, the job "tested" at the top
      # of build.yml): the tree every step before this one passed on, one
      # line of this job's log. Last, so it is written only when they all
      # did. The gate runs in the job "gate" beside this one, every harness
      # in one of its shares, and the tree checks in the job "Tree checks"
      # (#5292), and scripts\dev\Tested-Tree.js counts this note only when
      # every share of the same run and its Tree checks passed. While the box
      # built, this was written only on GitHub's
      # hosted runner (#3874), so a VPS build left main to be built and
      # traced; every build is hosted now (#4983). A pull request's checkout is
      # GitHub's merge of it into main, so this is the tree a squash merge
      # gives main while main has not moved. In the log and not an artifact
      # since #3399: this
      # repository's artifact storage is counted by the hour, it used
      # October's whole allowance by 23 Oct 2026, and from then the note's
      # upload failed and took every pull request's build red. A log costs no
      # storage and is kept 90 days; scripts\dev\Tested-Tree.js reads it.
      # In the merge queue (#5182) the checkout is the queue's own merge, the
      # very commit that lands on main, so the note is written there too.
      - name: Write down the tree these checks passed on
        if: env.REACHES != 'false' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $tree = (git rev-parse 'HEAD^{tree}' | Out-String).Trim()
          if ($tree -notmatch '^[0-9a-f]{40}$') { Write-Host "::error::git gave no tree for HEAD: $tree"; exit 1 }
          Write-Host ('TESTED-TREE {0} commit {1} pull request {2} head {3}' -f $tree, $env:GITHUB_SHA, $env:PR_NUMBER, $env:PR_HEAD)

      # No other artifact from this build (#2163, 19 Oct). It used to keep the exe
      # for 7 days, and nothing read it: a launcher goes out only in
      # merge-release.yml's package, and no script or test downloads a build's
      # artifacts. Measured 19 Oct: 488 copies, 1.30 GB of this account's 2 GB
      # of Actions storage, which Patrick's billing page read at 1.8 GB. The
      # pdb was never kept either (#1356 / #462): it carries absolute
      # build-machine source paths.
      # The gate's reports are the only artifacts of a build (#5295): each
      # share's, kept a day for the job "Gate report" of the same run, and
      # the merged one, kept 14 days. #3399's failures were a private
      # repository's storage allowance; since 30 Oct 2026 this repository is
      # public, where GitHub bills no Actions storage, and gate-map.yml has
      # kept its map as an artifact here since.

  # One of the three checks main's ruleset requires (#3683): passes only
  # when the build and every share of the gate above succeeded. Written by
  # Build-PrWorkflow.js, which says why.
  result:
    name: Build check result
    needs: [pick, checks, launcher, gate, gate-linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The tree checks, the launcher build and the gate passed
        env:
          PICK: ${{ needs.pick.result }}
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.launcher.result }}
          GATE: ${{ needs.gate.result }}
          GATE_LINUX: ${{ needs['gate-linux'].result }}
          REACHES_LAUNCHER: ${{ needs.pick.outputs.launcher }}
          SHARES: ${{ needs.pick.outputs.shares }}
          LINUX_SHARES: ${{ needs.pick.outputs.linux_shares }}
        run: |
          echo "Pick the gate harnesses: $PICK"
          echo "Tree checks: $CHECKS"
          echo "Launcher builds: $BUILD (the change reaches it: $REACHES_LAUNCHER)"
          echo "Gate harnesses, every share: $GATE (shares: $SHARES)"
          echo "Gate harnesses on Linux, every share: $GATE_LINUX (shares: $LINUX_SHARES)"
          ok=1
          [ "$PICK" = success ] || ok=0
          [ "$CHECKS" = success ] || ok=0
          [ "$BUILD" = success ] || ok=0
          if [ "$GATE" != success ]; then
            if [ "$GATE" = skipped ] && [ "$PICK" = success ] && [ "$SHARES" = "[]" ]; then echo "The gate was skipped: the change reaches no gate harness (#5292)"; else ok=0; fi
          fi
          if [ "$GATE_LINUX" != success ]; then
            if [ "$GATE_LINUX" = skipped ] && [ "$PICK" = success ] && [ "$LINUX_SHARES" = "[]" ]; then echo "The gate on Linux was skipped: the change reaches no harness that runs there (#5293)"; else ok=0; fi
          fi
          if [ "$ok" = 1 ]; then exit 0; fi
          echo "::error::the pick, the tree checks, the launcher build or a share of the gate did not pass, so this pull request may not merge"
          exit 1
