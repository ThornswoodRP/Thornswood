# The release note rules' tests (#5179, plan rev 64): tools/ReleaseNotes is
# the rules in C#, the one copy (#5354). thornswood-notes builds
# NoteRules.cs for the "Release note" check (pr-body.yml), and Ship,
# Rollback-Feed, Deploy-DevGamemode, Collect-ReleaseNotes and EnginePin
# compile the same file into PowerShell with Add-Type, since the box that
# runs a Ship has no .NET SDK.
#
# PULL REQUESTS that touch the rules, their tests, the fixture or this file:
# dotnet test on tools/ReleaseNotes.Tests from the locked packages (every
# case in tests/fixtures/note-rules-cases.json), and tests/test-note-rules.ps1,
# which compiles NoteRules.cs with Add-Type the way the scripts do, so a
# change that pwsh cannot compile fails here and not at a Ship.
# Read only, no secret.
name: Release note rules

on:
  pull_request:
    paths:
      - 'tools/ReleaseNotes/**'
      - 'tools/ReleaseNotes.Tests/**'
      - 'tests/fixtures/note-rules-cases.json'
      - 'tests/test-note-rules.ps1'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Release note rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: The C# rules against the fixture
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          dotnet restore tools/ReleaseNotes.Tests --locked-mode
          dotnet test tools/ReleaseNotes.Tests --no-restore
      - name: The rules as the release scripts load them
        shell: pwsh
        run: ./tests/test-note-rules.ps1
