# A merged pull request that carries an issue's test task moves that issue to
# Done (#2796).
#
# WHY. Patrick, 19 Oct 2026: Done is "merged and only needs testing". A pull
# request that finishes an issue says Closes #N, and the board's own "Pull
# request merged" workflow moves the card. A fix people would notice says
# Refs #N instead, because its issue stays open until a main Ship puts the
# fix on the main server (docs/guide/the-board.md), and nothing moved
# its card: the board
# review of 21 Oct (#3192) found Refs fixes sitting in In Progress for days
# after they merged, and the weekly review of 19 Oct found 72 issues closed
# with no Test task at all. Refs alone cannot say done, because it is also
# how a pull request names work it only touches. So the pull request says it:
#
#     Test task for #123: Forge lists only what you can make
#     Server: Main
#
#     1. ...
#
# A line "Test task for #N: <title>" in the pull request's body, with the
# steps under it, marks it as the fix for #N. The block runs to the next such
# line, a heading, a --- rule, a line that starts with an emoji (the
# "Generated with" footer) or the end. Patrick approved this on the board
# review page, 21 Oct. bot/pr_tasks.py reads the body with the same three
# patterns while the pull request is open, and test-tasks.yml holds every
# block to the bot's post rules there (#5199); change a pattern here and
# change it there, or bot/tests/test-5199-pr-tasks.py fails.
#
# WHAT IT DOES. On each push to main, for every commit in it, it asks GitHub
# which merged pull request the commit came from, and reads its body. For each
# "Test task for #N" naming an open issue of this repository it writes a
# comment on the issue with the test task in a fenced block, so the bot never
# reads it as a test task to post. The card moves to Done by itself: board.yml
# reads the same merged test task (#5185). Until then this put a board: Done
# label on with Patrick's board token for board-status.yml to carry out.
# The main Ship that carries the merge closes the issue with that block as
# its "Test task:" comment
# (scripts/release/Close-ShippedIssues.ps1, #3279), reading the merge commit
# and the block from this comment: change its first line or its footer and
# that script, and tests/test-3279-close-shipped.ps1, change with it. A closed
# issue or a pull request number is said and passed over. It checks out
# nothing and runs no action.
#
# THE TOKEN. The run's own, for the reads and the comment. It has no secret
# and no environment since #5185.
#
# A MERGE THE PUSH RUN MISSED (#1626). Until #3273 was fixed, every run read
# no pull request behind its commits, so the merges of that morning moved
# nothing and wrote no comment. A push event is not sent again, and the main
# Ship closes only an issue whose done-on-merge comment names a merge it
# carries, so those issues would sit in Done for ever. Started by hand with
# the merge commits, it does for them exactly what the push would have done.
# An issue that already holds this workflow's comment for that pull request
# is said and passed over, so running it twice writes nothing twice.
#
#     gh workflow run done-on-merge.yml --ref main -f merges="<sha> <sha>"
#
# WHERE IT RUNS. On GitHub's Windows runner (#4983). Every push to main
# takes a few seconds; a push with no test task in its pull request
# makes one call per commit and stops.
name: Done on merge
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      merges:
        description: 'Merge commits on main whose push run moved nothing, by spaces'
        required: true
permissions:
  contents: read
  pull-requests: read
  issues: write
jobs:
  done:
    name: Move test-tasked issues to Done
    runs-on: windows-latest
    # A call per commit and three per issue. Past this it is stuck, not slow.
    timeout-minutes: 3
    steps:
      - name: Read the merged pull request and move what it finishes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS: ${{ toJSON(github.event.commits.*.id) }}
          MERGES: ${{ inputs.merges }}
        run: |
          $ErrorActionPreference = 'Stop'
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          function Has($o, [string]$n) { return ($null -ne $o -and $o.PSObject.Properties[$n] -and $null -ne $o.$n) }
          if ($env:MERGES) {
            $shas = @(([string]$env:MERGES).Trim() -split '[\s,]+' | Where-Object { $_ })
            foreach ($sha in $shas) { if ($sha -notmatch '^[0-9a-fA-F]{7,40}$') { throw ("'{0}' is not a commit; merges takes merge commits, by spaces" -f $sha) } }
          } else {
            $shas = @($env:COMMITS | ConvertFrom-Json)
          }
          $prs = @{}
          foreach ($sha in $shas) {
            # Through ForEach-Object so the list is one pull request per item:
            # Invoke-RestMethod hands a JSON array on as one object, and @() alone
            # kept the whole list as a single item (#2798, #3273).
            foreach ($p in @(Invoke-RestMethod -Method Get -Uri "$api/commits/$sha/pulls" -Headers $h | ForEach-Object { $_ })) {
              if ((Has $p 'merged_at') -and [string]$p.base.ref -eq 'main') { $prs[[int]$p.number] = $p }
            }
          }
          if ($prs.Count -eq 0) { Write-Host ("no merged pull request behind {0} commit(s)" -f $shas.Count); return }
          foreach ($num in @($prs.Keys | Sort-Object)) {
            $p = $prs[$num]
            $lines = @((([string]$p.body) -replace "`r`n", "`n") -split "`n")
            $tasks = New-Object System.Collections.Generic.List[object]
            $cur = $null
            foreach ($l in $lines) {
              $m = [regex]::Match($l, '^\s*Test task for #(\d+)\s*:\s*(.+?)\s*$')
              if ($m.Success) {
                $cur = [ordered]@{ issue = [int]$m.Groups[1].Value; title = $m.Groups[2].Value; rest = New-Object System.Collections.Generic.List[string] }
                $tasks.Add($cur); continue
              }
              if ($cur -and ($l -match '^\s*#{1,6}\s' -or $l -match '^\s*---\s*$' -or $l -match '^\s*[\uD800-\uDBFF]')) { $cur = $null; continue }
              if ($cur) { $cur.rest.Add($l) }
            }
            if ($tasks.Count -eq 0) { Write-Host ("#{0}: no test task in the body, nothing to move" -f $num); continue }
            foreach ($t in $tasks) {
              $i = Invoke-RestMethod -Method Get -Uri ("$api/issues/" + $t.issue) -Headers $h
              if (Has $i 'pull_request') { Write-Host ("#{0} names #{1}, which is a pull request; passed over" -f $num, $t.issue); continue }
              if ([string]$i.state -ne 'open') { Write-Host ("#{0} names #{1}, which is closed; passed over" -f $num, $t.issue); continue }
              # Started by hand for a merge already moved, or twice: its comment
              # is there, so nothing is written again.
              $said = $false
              for ($pg = 1; -not $said; $pg++) {
                $page = @(Invoke-RestMethod -Method Get -Uri ("$api/issues/" + $t.issue + "/comments?per_page=100&page=$pg") -Headers $h | ForEach-Object { $_ })
                foreach ($k in $page) {
                  if ((Has $k 'user') -and [string]$k.user.login -eq 'github-actions[bot]' -and ([string]$k.body).StartsWith(('Pull request #{0} merged (' -f $num))) { $said = $true }
                }
                if ($page.Count -lt 100) { break }
              }
              if ($said) { Write-Host ("#{0} finishes #{1}, which already holds its done-on-merge comment; passed over" -f $num, $t.issue); continue }
              $steps = (($t.rest -join "`n").Trim())
              # A Dev test task is for developers and goes up as soon as a dev
              # release carries the work, written by that dev Ship (#5199); a
              # Main one when a main Ship does. The main Ship closes the issue
              # either way, and writes this block on it unless a test task of
              # the same kind was written after the merge (docs/guide/the-board.md,
              # "Test tasks and known issues").
              if ($steps -match '^\s*Server\s*:\s*Dev\s*(\n|$)') {
                $when = 'This test task is for developers. The dev Ship that carries it writes it on this issue with its Build: line naming that release, and the bot posts it in #dev-test-tasks (scripts/release/Close-ShippedIssues.ps1 -Dev). The main Ship that carries it closes this issue, and writes this on it if nobody has:'
              } else {
                $when = 'The main Ship that carries it closes this issue with a comment holding exactly this (scripts/release/Close-ShippedIssues.ps1):'
              }
              $body = ('Pull request #{0} merged ({1}), so this is in Done and stays open: the merge puts the fix on the main branch, not on the main server testers play. {2}' -f $num, ([string]$p.merge_commit_sha).Substring(0, 12), $when) + "`n`n" + '```' + "`n" + 'Test task: ' + $t.title + "`n" + $steps + "`n" + '```' + "`n`n---`n_Done on merge, .github/workflows/done-on-merge.yml_"
              Invoke-RestMethod -Method Post -Uri ("$api/issues/" + $t.issue + '/comments') -Headers $h -Body (@{ body = $body } | ConvertTo-Json -Compress) -ContentType 'application/json' | Out-Null
              Write-Host ("#{0} finishes #{1}: test task written on the issue" -f $num, $t.issue)
            }
          }
