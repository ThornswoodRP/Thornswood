# Patrick's click for one live box run (Ops #289, #4989).
#
# WHY HERE. A live verb of the deploy gate (a verb scripts/vps/gate/verbs.json
# marks "build": true: Deploy-Server, Publish-Server-Main, Reset-Npcs-Main,
# Ship-Main) changes what people play on, so it runs only once Patrick has
# approved that run. GitHub holds a job to a required reviewer only in a
# public repository on the organization's plan (Free, Pro and Team alike), so
# the click cannot live in the private ops repository, where box-run.yml
# runs; it lives here, in the environment "Live box run", whose only required
# reviewer is Patrick and which only main may use.
#
# HOW. A session runs
#
#   pwsh scripts/vps/Box-Run.ps1 -Line 'Deploy-Server -GamemodeOnly -Build <main's full commit>'
#
# which starts this with the line and stops, saying the run waits for
# Patrick. He approves it on its page (Review deployments, Approve), the same
# click as a main promotion. Then
#
#   pwsh scripts/vps/Box-Run.ps1 -Line '<the same line>' -Word <this run>
#
# starts box-run.yml in the ops repository, whose job "word" reads this run
# through GitHub's API and sends the line on only when it is a run of this
# file on main, ended in success, titled with exactly that line, approved by
# Patrick on "Live box run", and named by no box run before.
#
# This run holds no secret, checks nothing out and reaches nothing: it is the
# record of a click, and nothing more. Its title is the line, which is public
# like the run.
name: Live box run word
run-name: 'Live box run: ${{ inputs.line }}'
on:
  workflow_dispatch:
    inputs:
      line:
        description: 'The live line of the deploy gate Patrick is asked to approve'
        required: true
permissions: {}
jobs:
  word:
    name: Patrick's word for a live box run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Live box run
    timeout-minutes: 5
    steps:
      - name: Say what Patrick approved
        shell: pwsh
        env:
          BOX_LINE: ${{ inputs.line }}
        run: |
          Write-Host ('Patrick approved this live box run: ' + $env:BOX_LINE)
